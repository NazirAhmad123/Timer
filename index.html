<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Sharp Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100&family=Ubuntu:wght@400;500;700&display=swap');

        :root {
            --paper: #ffffff;
            --ink: #000000;
            --ink-muted: #999999;
            --heart-red: #ff4d4d;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--paper);
            font-family: 'Ubuntu', sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUpFade 0.8s var(--ease-out-expo) forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #timer {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 1.5rem;
        }

        .editable-time {
            display: inline-block;
            min-width: 1.2ch;
            color: var(--ink);
            font-weight: 100;
            font-size: clamp(4.5rem, 22vw, 6.5rem);
            outline: none;
            cursor: text;
            line-height: 0.8;
            letter-spacing: 0.05em;
        }

        .is-stacked #timer { flex-direction: column; margin-bottom: 1.2rem; }
        .is-stacked .editable-time { font-size: clamp(7rem, 35vw, 10rem); }
        .is-stacked #s { opacity: 0.6; transform: scaleX(0.98); }
        .colon { opacity: 0.4; font-size: 3rem; font-weight: 100; margin: 0 10px; }
        .is-stacked .colon { display: none; } 

        /* --- SYMMETRICAL ADJUSTERS --- */
        .adjusters {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 3rem;
        }

        .adj-group { 
            display: flex; 
            gap: 12px; 
        }

        /* Order adjustment for desktop row logic */
        .minus-group { flex-direction: row; }
        .plus-group { flex-direction: row; }

        @media (max-width: 480px) {
            .adjusters { gap: 40px; }
            /* Vertical stack on mobile: Minutes on top of seconds */
            .adj-group { flex-direction: column; gap: 8px; }
            .minus-group { flex-direction: column-reverse; } /* Puts -1M on top of -30S */
            .plus-group { flex-direction: column; } /* Puts +1M on top of +30S */
        }

        .adj-btn {
            background: transparent;
            border: 1px solid #e0e0e0;
            padding: 8px 10px;
            font-size: 0.55rem;
            font-family: 'Ubuntu';
            font-weight: 700;
            color: var(--ink);
            border-radius: 0px;
            cursor: pointer;
            min-width: 55px;
            transition: border-color 0.2s;
        }
        .adj-btn:hover { border-color: var(--ink); }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            padding: 0 60px;
        }

        button.action {
            width: 100%;
            background: var(--paper);
            border: 1.5px solid var(--ink);
            padding: 1.2rem 0;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 0px;
            color: var(--ink);
        }

        button.primary { background-color: var(--ink); color: var(--paper); }

        #resetBtn { 
            background: transparent; 
            border: none; 
            color: var(--ink); 
            opacity: 0; 
            pointer-events: none;
            font-size: 0.5rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            padding-top: 10px;
        }
        .is-dirty #resetBtn { opacity: 0.5; pointer-events: auto; }

        #viewSwitcher {
            margin-top: 1.5rem;
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 10px 20px;
            border: 1px solid var(--ink);
            background: transparent;
            cursor: pointer;
        }

        #reminder {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: var(--paper);
            padding: 18px 50px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.6s var(--ease-out-expo);
            z-index: 100;
        }
        #reminder.show { bottom: 0; width: 100%; text-align: center; }

        .footer {
            margin-top: 3.5rem;
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-muted);
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .footer-top { display: flex; align-items: center; gap: 6px; }

        .heart {
            font-size: 1rem;
            color: var(--ink-muted);
            cursor: default;
            transition: color 0.3s ease, transform 0.3s var(--ease-out-expo);
            display: inline-block;
            line-height: 1;
        }

        .heart:hover {
            color: var(--heart-red);
            transform: scale(1.2);
        }

        .footer-bottom { font-size: 0.5rem; opacity: 0.8; letter-spacing: 0.3em; }
    </style>
</head>
<body class="is-stacked">

<div class="container">
    <div id="timer">
        <span id="m" class="editable-time" contenteditable="true">02</span>
        <span class="colon">:</span>
        <span id="s" class="editable-time" contenteditable="true">30</span>
    </div>

    <div class="adjusters">
        <div class="adj-group minus-group">
            <button class="adj-btn" onclick="adjustTime(-30)">-30S</button>
            <button class="adj-btn" onclick="adjustTime(-60)">-1M</button>
        </div>
        <div class="adj-group plus-group">
            <button class="adj-btn" onclick="adjustTime(60)">+1M</button>
            <button class="adj-btn" onclick="adjustTime(30)">+30S</button>
        </div>
    </div>
    
    <div class="controls">
        <button id="toggleBtn" class="action primary">Start</button>
        <button id="resetBtn" class="action">Reset Session</button>
    </div>

    <div id="viewSwitcher">Switch View</div>

    <footer class="footer">
        <div class="footer-top">made with <span class="heart">♥</span></div>
        <div class="footer-bottom">by Nazir Noori</div>
    </footer>
</div>

<div id="reminder">ACTION REQUIRED: SUBMIT</div>

<script>
    let timeLeft = 150;
    let initialDuration = 150;
    let timerId = null;
    let expectedTime = null;
    let audioCtx = null;

    const elBody = document.body;
    const elMin = document.getElementById('m');
    const elSec = document.getElementById('s');
    const elToggle = document.getElementById('toggleBtn');
    const elReset = document.getElementById('resetBtn');
    const elView = document.getElementById('viewSwitcher');
    const elReminder = document.getElementById('reminder');

    elView.addEventListener('click', () => elBody.classList.toggle('is-stacked'));

    const initAudio = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

    const playNotification = () => {
        if (!audioCtx) return;
        const playTone = (delay) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const startTime = audioCtx.currentTime + delay;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, startTime); 
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.2, startTime + 0.1); 
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.8);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.8);
        };
        playTone(0); playTone(1.0);
    };

    const updateUI = () => {
        const m = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
        const s = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
        elMin.innerText = m;
        elSec.innerText = s;
        document.title = `${m}:${s}`;
        timeLeft !== initialDuration ? elBody.classList.add('is-dirty') : elBody.classList.remove('is-dirty');
    };

    window.adjustTime = (seconds) => {
        syncTimeFromInputs();
        timeLeft = Math.max(0, timeLeft + seconds);
        if (!timerId) initialDuration = timeLeft;
        updateUI();
    };

    const syncTimeFromInputs = () => {
        const m = parseInt(elMin.innerText.replace(/\D/g,'')) || 0;
        const s = parseInt(elSec.innerText.replace(/\D/g,'')) || 0;
        timeLeft = (m * 60) + s;
    };

    const tick = () => {
        if (timeLeft > 0) {
            const now = Date.now();
            const drift = now - expectedTime;
            timeLeft--;
            updateUI();
            expectedTime += 1000;
            timerId = setTimeout(tick, Math.max(0, 1000 - drift));
        } else {
            complete();
        }
    };

    const start = () => {
        initAudio();
        syncTimeFromInputs();
        if (timeLeft <= 0) return;
        elReminder.classList.remove('show');
        elBody.classList.add('is-running');
        elBody.classList.remove('is-paused');
        elToggle.textContent = "Pause";
        expectedTime = Date.now() + 1000;
        timerId = setTimeout(tick, 1000);
    };

    const pause = () => {
        elBody.classList.remove('is-running');
        elBody.classList.add('is-paused');
        clearTimeout(timerId);
        timerId = null;
        elToggle.textContent = "Resume";
    };

    const complete = () => {
        pause();
        elBody.classList.remove('is-paused', 'is-dirty');
        playNotification();
        elReminder.classList.add('show');
        elToggle.textContent = "Start New";
        timeLeft = initialDuration; 
        updateUI();
    };

    const reset = () => {
        pause();
        elReminder.classList.remove('show');
        elBody.classList.remove('is-paused', 'is-dirty');
        timeLeft = initialDuration;
        elToggle.textContent = "Start";
        updateUI();
    };

    [elMin, elSec].forEach(el => {
        el.addEventListener('blur', () => {
            let val = parseInt(el.innerText.replace(/\D/g,'')) || 0;
            el.innerText = val.toString().padStart(2, '0');
            syncTimeFromInputs();
            if(!timerId) initialDuration = timeLeft;
        });
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        });
    });

    elToggle.addEventListener('click', () => (timerId ? pause() : start()));
    elReset.addEventListener('click', reset);
    updateUI();
</script>

</body>
</html>
