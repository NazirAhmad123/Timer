const selectText=el=>{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r)};const normalize=()=>{syncTime();if(!timerId){initialDuration=timeLeft;localStorage.setItem('nazirTimerDuration',String(initialDuration))}updateUI()};let minuteAutoAdvanceTimer=null;const moveToSeconds=()=>{clearTimeout(minuteAutoAdvanceTimer);setStatus('Type seconds · Enter to start');setTimeout(()=>{elSec.focus({preventScroll:true});selectText(elSec)},0)};const sanitizeField=el=>{let digits=el.innerText.replace(/\D/g,'').slice(0,2);if(el===elSec&&digits.length===2)digits=String(Math.min(parseInt(digits,10)||0,59)).padStart(2,'0');if(el.innerText!==digits)el.innerText=digits;return digits};[elMin,elSec].forEach(el=>{el.addEventListener('focus',()=>{clearTimeout(minuteAutoAdvanceTimer);elBody.classList.add('is-editing');setStatus(el===elMin?'Type minutes':'Type seconds · Enter to start');selectText(el)});el.addEventListener('keydown',e=>{const allowed=['Backspace','Delete','ArrowLeft','ArrowRight','Tab'];if(e.key==='Escape'){e.preventDefault();el.blur();return}if(e.key==='Enter'){e.preventDefault();if(el===elMin){moveToSeconds()}else{normalize();el.blur();elBody.classList.remove('is-editing');if(timeLeft>0&&!timerId)start()}return}if(el===elMin&&(e.key===':'||e.key===';')){e.preventDefault();moveToSeconds();return}if(allowed.includes(e.key))return;if(!/^\d$/.test(e.key))e.preventDefault()});el.addEventListener('input',()=>{const digits=sanitizeField(el);if(el===elMin){clearTimeout(minuteAutoAdvanceTimer);if(digits.length>=2)moveToSeconds();else if(digits.length===1)minuteAutoAdvanceTimer=setTimeout(moveToSeconds,650)}});el.addEventListener('paste',e=>{e.preventDefault();const raw=e.clipboardData.getData('text').replace(/\D/g,'');if(!raw)return;if(el===elMin&&raw.length>2){const seconds=raw.slice(-2);const minutes=raw.slice(0,-2).slice(-2);elMin.innerText=String(parseInt(minutes||'0',10)).padStart(minutes.length>1?2:1,'0');elSec.innerText=String(Math.min(parseInt(seconds,10)||0,59)).padStart(2,'0');moveToSeconds();normalize();return}const text=raw.slice(0,2);document.execCommand('insertText',false,text);setTimeout(()=>{const digits=sanitizeField(el);if(el===elMin&&digits.length>0){digits.length>=2?moveToSeconds():minuteAutoAdvanceTimer=setTimeout(moveToSeconds,650)}},0)});el.addEventListener('blur',()=>{clearTimeout(minuteAutoAdvanceTimer);elBody.classList.remove('is-editing');normalize()})});
const breathPattern=[{label:'Inhale',className:'inhale',seconds:4},{label:'Hold',className:'hold',seconds:2},{label:'Exhale',className:'exhale',seconds:6}];const stopBreathing=()=>{clearTimeout(breathTimer);clearInterval(breathCountdown);breathTimer=null;breathCountdown=null;breathStep=0;elBreathOrb.classList.remove('inhale','hold','exhale');elBreathText.textContent='Inhale';elBreathCount.textContent='4';elStartBreath.textContent='Start breathing'};const runBreathStep=()=>{const step=breathPattern[breathStep%breathPattern.length];let remaining=step.seconds;elBreathOrb.classList.remove('inhale','hold','exhale');elBreathOrb.classList.add(step.className);elBreathText.textContent=step.label;elBreathCount.textContent=remaining;clearInterval(breathCountdown);breathCountdown=setInterval(()=>{remaining-=1;elBreathCount.textContent=Math.max(remaining,0)},1000);clearTimeout(breathTimer);breathTimer=setTimeout(()=>{clearInterval(breathCountdown);breathStep++;runBreathStep()},step.seconds*1000)};const openBreathing=()=>{haptic(6);if(timerId)pause();elBody.classList.add('breath-open');elBreathOverlay.classList.add('show');elBreathOverlay.setAttribute('aria-hidden','false');elBreak.setAttribute('aria-expanded','true');setTimeout(()=>elCloseBreath.focus({preventScroll:true}),80)};const closeBreathing=()=>{haptic(6);stopBreathing();elBody.classList.remove('breath-open');elBreathOverlay.classList.remove('show');elBreathOverlay.setAttribute('aria-hidden','true');elBreak.setAttribute('aria-expanded','false')};
elBreak.addEventListener('click',openBreathing);elCloseBreath.addEventListener('click',closeBreathing);elStartBreath.addEventListener('click',()=>{haptic(8);stopBreathing();elStartBreath.textContent='Restart breathing';runBreathStep()});elStopBreath.addEventListener('click',()=>{haptic(6);stopBreathing()});elBreathOverlay.addEventListener('click',e=>{if(e.target===elBreathOverlay)closeBreathing()});document.addEventListener('pointermove',e=>{if(rafPointer)return;rafPointer=requestAnimationFrame(()=>{document.documentElement.style.setProperty('--mx',(e.clientX/window.innerWidth*100).toFixed(1)+'%');document.documentElement.style.setProperty('--my',(e.clientY/window.innerHeight*100).toFixed(1)+'%');rafPointer=null})},{passive:true});document.addEventListener('keydown',e=>{const active=document.activeElement,isEditing=active&&active.isContentEditable;if(e.key==='Escape'){closeBreathing();return}if(isEditing||elBreathOverlay.classList.contains('show'))return;if(e.code==='Space'){e.preventDefault();timerId?pause():start()}if(e.key.toLowerCase()==='r')reset();if(e.key.toLowerCase()==='b')openBreathing();if(e.key.toLowerCase()==='m')toggleMute();if(e.key==='ArrowUp'){e.preventDefault();adjustTime(60)}if(e.key==='ArrowDown'){e.preventDefault();adjustTime(-60)}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timerId)tick()});elToggle.addEventListener('click',()=>timerId?pause():start());elReset.addEventListener('click',reset);elSoundToggle&&elSoundToggle.addEventListener('click',toggleMute);load();loadMutePreference();updateMuteUI();updateUI();
</script>
