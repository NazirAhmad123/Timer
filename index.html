
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100&family=Ubuntu:wght@400;500;700&display=swap');

    :root {
      --paper: #ffffff;
      --ink: #000000;
      --ink-muted: #f2f2f2;
      --heart-red: #ff4d4d;
      --action-border: #feb2b2;
      --action-text: #742a2a;
      --soft-shadow: rgba(0, 0, 0, 0.08);
      --emoji-shadow: rgba(0, 0, 0, 0.14);
      --complete-bottom: 68px;
      --progress: 0%;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-soft: cubic-bezier(0.34, 1.18, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-butter: cubic-bezier(0.19, 1, 0.22, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { height: 100%; }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      background: var(--paper);
      font-family: 'Ubuntu', sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -22%;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.96);
      background:
        radial-gradient(circle at 50% 32%, rgba(254,178,178,0.12), transparent 34%),
        radial-gradient(circle at 50% 72%, rgba(0,0,0,0.035), transparent 32%);
      transition: opacity 900ms var(--ease-butter), transform 900ms var(--ease-butter);
    }

    body.is-running::before,
    body.finished::before { opacity: 1; transform: scale(1); }

    .container {
      text-align: center;
      width: min(92vw, 450px);
      padding: clamp(16px, 4vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 900ms var(--ease-out-expo), opacity 500ms var(--ease-smooth);
    }

    body.finished .container { transform: translateY(-10px); }

    .label {
      font-size: 0.5rem;
      letter-spacing: 0.6em;
      text-transform: uppercase;
      opacity: 0.2;
      margin-bottom: clamp(1rem, 3vh, 1.5rem);
    }

    #timer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      margin-bottom: clamp(1.35rem, 4vh, 2rem);
      width: 100%;
      isolation: isolate;
      will-change: transform;
    }

    #timer::before {
      content: "";
      position: absolute;
      width: min(72vw, 310px);
      height: min(72vw, 310px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 46%, rgba(0,0,0,0.052), transparent 42%),
        radial-gradient(circle at 50% 50%, rgba(254,178,178,0.2), transparent 58%);
      opacity: 0;
      transform: scale(0.82);
      filter: blur(18px);
      z-index: -1;
      transition: opacity 900ms var(--ease-butter), transform 900ms var(--ease-butter);
      pointer-events: none;
    }

    body.is-running #timer::before {
      opacity: 1;
      transform: scale(1);
      animation: timerHaloBreath 6.8s ease-in-out infinite;
    }

    @keyframes timerHaloBreath {
      0%, 100% { opacity: 0.58; transform: scale(0.97); }
      50% { opacity: 0.9; transform: scale(1.035); }
    }

    body.finished #timer { animation: timerRewardLift 900ms var(--ease-soft); }

    @keyframes timerRewardLift {
      0% { transform: translateY(0) scale(1); }
      38% { transform: translateY(-8px) scale(1.018); }
      100% { transform: translateY(0) scale(1); }
    }

    .editable-time {
      color: var(--ink);
      font-weight: 100;
      font-size: clamp(4.8rem, 20vw, 7.5rem);
      outline: none;
      line-height: 0.82;
      letter-spacing: -0.04em;
      min-width: 1.3em;
      text-shadow: 0 18px 42px rgba(0,0,0,0.035);
      transform: translate3d(0,0,0);
      transition:
        letter-spacing 700ms var(--ease-butter),
        text-shadow 700ms var(--ease-butter),
        transform 420ms var(--ease-butter),
        filter 420ms var(--ease-butter),
        background-color 240ms var(--ease-smooth),
        box-shadow 240ms var(--ease-smooth);
      will-change: transform, filter;
    }

    .editable-time:focus {
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(0,0,0,0.035), rgba(0,0,0,0.015));
      box-shadow: 0 0 0 10px rgba(0,0,0,0.025);
      caret-color: transparent;
    }

    body.is-running .editable-time {
      letter-spacing: -0.055em;
      text-shadow:
        0 22px 48px rgba(0,0,0,0.052),
        0 0 18px rgba(254,178,178,0.14);
      animation: numberLivingFloat 8s ease-in-out infinite;
    }

    #s.editable-time { animation-delay: 120ms; }

    @keyframes numberLivingFloat {
      0%, 100% { transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
      50% { transform: translate3d(0,-1px,0) scale(1.002); filter: brightness(1.015); }
    }

    .seconds-soft-pulse { animation: secondsSoftPulse 340ms var(--ease-butter); }

    @keyframes secondsSoftPulse {
      0%, 100% { transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
      45% {
        transform: translate3d(0,-0.7px,0) scale(1.0035);
        filter: brightness(1.022);
        text-shadow:
          0 22px 48px rgba(0,0,0,0.055),
          0 0 20px rgba(254,178,178,0.2);
      }
    }

    body.finished .editable-time {
      text-shadow:
        0 20px 45px rgba(0,0,0,0.055),
        0 0 28px rgba(254,178,178,0.28);
      animation: numberCompletionGlow 1400ms var(--ease-butter);
    }

    @keyframes numberCompletionGlow {
      0% { opacity: 0.88; transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
      38% { opacity: 1; transform: translate3d(0,-7px,0) scale(1.025); filter: brightness(1.08); }
      100% { opacity: 1; transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
    }

    .is-stacked #timer { flex-direction: column; }
    .is-stacked .editable-time { font-size: clamp(5.6rem, 30vw, 9.5rem); }
    .is-stacked .colon { display: none; }

    .colon {
      opacity: 0.1;
      font-size: clamp(2rem, 10vw, 3rem);
      margin: 0 10px;
      font-weight: 100;
      transition: opacity 400ms var(--ease-smooth), transform 400ms var(--ease-butter);
    }

    body.is-running .colon { animation: colonPulse 1s ease-in-out infinite; }

    @keyframes colonPulse {
      0%, 100% { opacity: 0.1; transform: scale(1); }
      50% { opacity: 0.28; transform: scale(1.06); }
    }

    .progress-track {
      width: 100%;
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0,0,0,0.045);
      margin-bottom: clamp(1.15rem, 3.6vh, 1.9rem);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 520ms var(--ease-smooth), transform 520ms var(--ease-butter);
    }

    body.is-running .progress-track,
    body.finished .progress-track {
      opacity: 1;
      transform: translateY(0);
    }

    .progress-bar {
      height: 100%;
      width: var(--progress);
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(0,0,0,0.78), rgba(0,0,0,0.36));
      transition: width 420ms linear;
    }

    .adjusters {
      display: flex;
      gap: 8px;
      margin-bottom: clamp(1.35rem, 4vh, 2.2rem);
      width: 100%;
      transition: opacity 700ms var(--ease-out-expo), transform 700ms var(--ease-out-expo);
    }

    .is-running .adjusters {
      opacity: 0.12;
      pointer-events: none;
      transform: translateY(4px);
    }

    .adj-btn {
      background: var(--ink-muted);
      border: none;
      padding: 14px 4px;
      min-height: 44px;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      flex: 1;
      border-radius: 12px;
      transition:
        transform 250ms var(--ease-out-expo),
        background-color 250ms var(--ease-smooth),
        opacity 250ms var(--ease-smooth),
        box-shadow 250ms var(--ease-smooth);
    }

    .adj-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.045); }
    .adj-btn:active { transform: scale(0.96); }
    .adj-btn sub { font-size: 0.4rem; bottom: 0; }

    .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    button.action {
      width: 100%;
      background: var(--paper);
      border: 1.2px solid var(--ink);
      padding: 1.3rem 0;
      min-height: 54px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 16px;
      transition:
        transform 250ms var(--ease-out-expo),
        background-color 250ms var(--ease-smooth),
        color 250ms var(--ease-smooth),
        opacity 250ms var(--ease-smooth),
        box-shadow 250ms var(--ease-smooth);
    }

    button.action:hover { box-shadow: 0 14px 30px rgba(0,0,0,0.055); transform: translateY(-1px); }
    button.action:active { transform: scale(0.98); }
    button.primary { background-color: var(--ink); color: var(--paper); }

    #resetBtn {
      border: none;
      opacity: 0;
      pointer-events: none;
      font-size: 0.55rem;
      color: var(--ink);
      margin-top: 8px;
    }

    .is-dirty #resetBtn { opacity: 0.3; pointer-events: auto; }

    .break-btn {
      margin-top: 1rem;
      border: none;
      background: transparent;
      color: var(--ink);
      opacity: 0.24;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      transition: opacity 260ms var(--ease-smooth), transform 260ms var(--ease-out-expo), background-color 260ms var(--ease-smooth);
    }

    .break-btn:hover { opacity: 0.58; background: var(--ink-muted); transform: translateY(-1px); }
    .break-btn:active { transform: scale(0.97); }
    .is-running .break-btn { opacity: 0.14; pointer-events: none; }

    #reminder {
      position: fixed;
      bottom: var(--complete-bottom);
      left: 50%;
      transform: translate3d(-50%, 92px, 0) scale(0.985);
      width: auto;
      background: var(--action-border);
      color: var(--action-text);
      padding: 18px 28px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 100px;
      box-shadow: 0 15px 35px var(--soft-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      opacity: 0;
      transition: transform 760ms var(--ease-butter), opacity 520ms var(--ease-smooth), box-shadow 760ms var(--ease-butter);
      z-index: 2000;
      pointer-events: none;
      overflow: visible;
      will-change: transform, opacity;
    }

    @supports (bottom: env(safe-area-inset-bottom)) {
      #reminder { bottom: calc(var(--complete-bottom) + env(safe-area-inset-bottom)); }
    }

    #reminder.show {
      transform: translate3d(-50%, 0, 0) scale(1);
      opacity: 1;
      box-shadow: 0 18px 40px rgba(0,0,0,0.10), 0 0 0 1px rgba(255,255,255,0.35) inset;
      animation: pillBreath 4.4s 1000ms ease-in-out infinite;
    }

    @keyframes pillBreath {
      0%, 100% { transform: translate3d(-50%, 0, 0) scale(1); }
      45% { transform: translate3d(-50%, -3px, 0) scale(1.016); }
      72% { transform: translate3d(-50%, -1px, 0) scale(1.006); }
    }

    .celebration-emoji {
      position: absolute;
      left: 50%;
      top: 50%;
      font-size: 1.08rem;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      text-shadow: 0 8px 14px var(--emoji-shadow);
      transform-origin: center;
      transform: translate3d(-50%, -50%, 0) scale(0.72) rotate(0deg);
      backface-visibility: hidden;
      will-change: transform, opacity;
    }

    .emoji-celebrate { --x: 58px; --y: -38px; --rot: 10deg; --delay: 0ms; font-size: 1.26rem; }
    .emoji-trophy { --x: 0px; --y: -55px; --rot: -4deg; --delay: 70ms; font-size: 1.2rem; }
    .emoji-star { --x: -55px; --y: -36px; --rot: -10deg; --delay: 130ms; font-size: 1.08rem; }
    .emoji-clap { --x: -58px; --y: 23px; --rot: -8deg; --delay: 190ms; font-size: 1.05rem; }
    .emoji-sparkle { --x: 58px; --y: 23px; --rot: 8deg; --delay: 250ms; font-size: 1rem; }

    #reminder.show .celebration-emoji {
      animation: emojiButterIn 820ms calc(var(--delay) + 260ms) var(--ease-butter) forwards;
    }

    #reminder.show .emoji-celebrate { animation: emojiButterIn 820ms calc(var(--delay) + 260ms) var(--ease-butter) forwards, celebrateAlive 4200ms calc(var(--delay) + 1150ms) ease-in-out infinite; }
    #reminder.show .emoji-trophy { animation: emojiButterIn 820ms calc(var(--delay) + 260ms) var(--ease-butter) forwards, trophyAlive 5200ms calc(var(--delay) + 1150ms) ease-in-out infinite; }
    #reminder.show .emoji-star { animation: emojiButterIn 820ms calc(var(--delay) + 260ms) var(--ease-butter) forwards, starAlive 4800ms calc(var(--delay) + 1150ms) ease-in-out infinite; }
    #reminder.show .emoji-clap { animation: emojiButterIn 820ms calc(var(--delay) + 260ms) var(--ease-butter) forwards, clapAlive 3600ms calc(var(--delay) + 1150ms) ease-in-out infinite; }
    #reminder.show .emoji-sparkle { animation: emojiButterIn 820ms calc(var(--delay) + 260ms) var(--ease-butter) forwards, sparkleAlive 5600ms calc(var(--delay) + 1150ms) ease-in-out infinite; }

    @keyframes emojiButterIn {
      0% { opacity: 0; transform: translate3d(calc(-50% + (var(--x) * 0.14)), calc(-50% + (var(--y) * 0.14)), 0) scale(0.52) rotate(calc(var(--rot) * 0.12)); }
      44% { opacity: 1; transform: translate3d(calc(-50% + (var(--x) * 0.84)), calc(-50% + (var(--y) * 0.84)), 0) scale(1.075) rotate(calc(var(--rot) * 0.82)); }
      70% { opacity: 1; transform: translate3d(calc(-50% + (var(--x) * 0.97)), calc(-50% + (var(--y) * 0.97)), 0) scale(0.992) rotate(calc(var(--rot) * 0.96)); }
      100% { opacity: 1; transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(1) rotate(var(--rot)); }
    }

    @keyframes celebrateAlive {
      0%, 100% { transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(1) rotate(var(--rot)); }
      18% { transform: translate3d(calc(-50% + var(--x) + 2px), calc(-50% + var(--y) - 3px), 0) scale(1.035) rotate(16deg); }
      42% { transform: translate3d(calc(-50% + var(--x) - 1px), calc(-50% + var(--y) + 1px), 0) scale(1.005) rotate(6deg); }
      68% { transform: translate3d(calc(-50% + var(--x) + 1px), calc(-50% + var(--y) - 2px), 0) scale(1.012) rotate(12deg); }
    }

    @keyframes trophyAlive {
      0%, 100% { transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(1) rotate(var(--rot)); }
      32% { transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y) - 4px), 0) scale(1.018) rotate(-1deg); }
      58% { transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y) + 1px), 0) scale(0.998) rotate(-5deg); }
    }

    @keyframes starAlive {
      0%, 100% { opacity: 0.86; transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(1) rotate(var(--rot)); }
      38% { opacity: 1; transform: translate3d(calc(-50% + var(--x) - 2px), calc(-50% + var(--y) - 3px), 0) scale(1.075) rotate(11deg); }
      64% { opacity: 0.92; transform: translate3d(calc(-50% + var(--x) + 1px), calc(-50% + var(--y)), 0) scale(1.015) rotate(-4deg); }
    }

    @keyframes clapAlive {
      0%, 100% { transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(1) rotate(var(--rot)); }
      22% { transform: translate3d(calc(-50% + var(--x) + 1px), calc(-50% + var(--y) - 1px), 0) scale(1.045) rotate(8deg); }
      36% { transform: translate3d(calc(-50% + var(--x) - 1px), calc(-50% + var(--y)), 0) scale(1.012) rotate(-10deg); }
      52% { transform: translate3d(calc(-50% + var(--x) + 1px), calc(-50% + var(--y) - 1px), 0) scale(1.028) rotate(5deg); }
      68% { transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(1.004) rotate(-7deg); }
    }

    @keyframes sparkleAlive {
      0%, 100% { opacity: 0.86; transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(1) rotate(var(--rot)); }
      34% { opacity: 1; transform: translate3d(calc(-50% + var(--x) + 3px), calc(-50% + var(--y) - 3px), 0) scale(1.07) rotate(20deg); }
      66% { opacity: 0.92; transform: translate3d(calc(-50% + var(--x) - 1px), calc(-50% + var(--y) + 1px), 0) scale(1.012) rotate(-5deg); }
    }

    .micro-sparkle { display: none; }

    .break-btn {
      margin-top: 1rem;
      border: none;
      background: transparent;
      color: var(--ink);
      opacity: 0.24;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      transition: opacity 260ms var(--ease-smooth), transform 260ms var(--ease-out-expo), background-color 260ms var(--ease-smooth);
    }
    .break-btn:hover { opacity: 0.58; background: var(--ink-muted); transform: translateY(-1px); }
    .break-btn:active { transform: scale(0.97); }
    .is-running .break-btn { opacity: 0.14; pointer-events: none; }

    .breath-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: radial-gradient(circle at 50% 34%, rgba(254,178,178,0.22), transparent 34%), rgba(255,255,255,0.76);
      opacity: 0;
      pointer-events: none;
      z-index: 3000;
      transition: opacity 520ms var(--ease-smooth);
      backdrop-filter: blur(16px) saturate(1.08);
    }
    .breath-overlay.show { opacity: 1; pointer-events: auto; }

    .breath-card {
      position: relative;
      width: min(92vw, 380px);
      padding: 28px 24px 24px;
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,250,250,0.92));
      box-shadow: 0 30px 90px rgba(0,0,0,0.12), 0 0 0 1px rgba(116,42,42,0.055) inset;
      text-align: center;
      overflow: hidden;
      transform: translate3d(0, 18px, 0) scale(0.982);
      opacity: 0;
      transition: transform 720ms var(--ease-butter), opacity 480ms ease;
    }
    .breath-card::before {
      content: "";
      position: absolute;
      inset: -35%;
      background: conic-gradient(from 90deg, transparent, rgba(254,178,178,0.16), transparent, rgba(0,0,0,0.035), transparent);
      opacity: 0.55;
      animation: breathCardAura 13s linear infinite;
      pointer-events: none;
    }
    .breath-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: linear-gradient(145deg, rgba(255,255,255,0.62), transparent 45%, rgba(254,178,178,0.08));
      pointer-events: none;
    }
    .breath-overlay.show .breath-card { transform: translate3d(0,0,0) scale(1); opacity: 1; }
    @keyframes breathCardAura { to { transform: rotate(360deg); } }
    .breath-card > * { position: relative; z-index: 1; }

    .breath-close {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 999px;
      background: rgba(0,0,0,0.055);
      color: var(--ink);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.62;
      transition: opacity 240ms var(--ease-smooth), transform 240ms var(--ease-out-expo), background-color 240ms var(--ease-smooth);
    }
    .breath-close:hover { opacity: 1; background: rgba(0,0,0,0.08); transform: scale(1.04); }
    .breath-close:active { transform: scale(0.95); }

    .breath-label { font-size: 0.52rem; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase; opacity: 0.28; margin-bottom: 0.7rem; }
    .breath-title { font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; opacity: 0.72; margin-bottom: 1.25rem; }

    .breath-orb-wrap { position: relative; display: grid; place-items: center; min-height: 220px; isolation: isolate; }
    .breath-ring { position: absolute; width: 132px; height: 132px; border-radius: 50%; border: 1px solid rgba(116,42,42,0.08); opacity: 0.55; transform: scale(0.84); pointer-events: none; }
    .breath-overlay.show .breath-ring { animation: breathRingPulse 6s ease-in-out infinite; }
    .ring-two { width: 164px; height: 164px; animation-delay: 350ms !important; opacity: 0.34; }
    .ring-three { width: 196px; height: 196px; animation-delay: 700ms !important; opacity: 0.22; }
    @keyframes breathRingPulse { 0%,100% { transform: scale(0.82); opacity: 0.18; } 45% { transform: scale(1.16); opacity: 0.5; } 70% { transform: scale(1.02); opacity: 0.26; } }

    .breath-particle { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: rgba(116,42,42,0.18); box-shadow: 0 0 18px rgba(254,178,178,0.55); opacity: 0.45; pointer-events: none; }
    .p-one { --tx:-80px; --ty:-62px; transform: translate(-76px,-54px); }
    .p-two { --tx:80px; --ty:-52px; transform: translate(74px,-44px); width: 4px; height: 4px; animation-delay: 800ms !important; }
    .p-three { --tx:-70px; --ty:76px; transform: translate(-62px,68px); width: 3px; height: 3px; animation-delay: 1400ms !important; }
    .p-four { --tx:66px; --ty:80px; transform: translate(58px,72px); width: 4px; height: 4px; animation-delay: 2000ms !important; }
    .breath-overlay.show .breath-particle { animation: breathParticleFloat 5.8s ease-in-out infinite; }
    @keyframes breathParticleFloat { 0%,100% { opacity: 0.22; } 50% { opacity: 0.64; transform: translate(var(--tx), var(--ty)) scale(1.25); } }

    .breath-orb {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.96), rgba(255,230,230,0.72) 34%, rgba(254,178,178,0.78) 72%);
      box-shadow: 0 22px 58px rgba(254,178,178,0.42), 0 0 0 1px rgba(116,42,42,0.08) inset;
      transform: scale(0.82);
      transition: transform 3800ms cubic-bezier(0.37,0,0.63,1), box-shadow 3800ms ease;
      will-change: transform;
      z-index: 2;
    }
    .breath-orb span { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--action-text); opacity: 0.78; }
    .breath-orb.inhale { transform: scale(1.24); box-shadow: 0 28px 76px rgba(254,178,178,0.48), 0 0 0 18px rgba(254,178,178,0.105), 0 0 0 1px rgba(116,42,42,0.08) inset; }
    .breath-orb.hold { transform: scale(1.24); box-shadow: 0 26px 68px rgba(254,178,178,0.44), 0 0 0 12px rgba(254,178,178,0.075), 0 0 0 1px rgba(116,42,42,0.08) inset; }
    .breath-orb.exhale { transform: scale(0.82); box-shadow: 0 16px 42px rgba(254,178,178,0.30), 0 0 0 0 rgba(254,178,178,0), 0 0 0 1px rgba(116,42,42,0.08) inset; }

    .breath-count { font-family: 'Montserrat', sans-serif; font-size: 2.65rem; font-weight: 100; line-height: 1; margin-top: 0.1rem; opacity: 0.58; }
    .breath-guide { margin-top: 0.75rem; font-size: 0.72rem; opacity: 0.46; }
    .breath-actions { display: grid; grid-template-columns: 1fr 0.72fr; gap: 10px; margin-top: 1.45rem; }
    .breath-action { border: 1px solid rgba(0,0,0,0.14); background: rgba(255,255,255,0.45); color: var(--ink); padding: 0.95rem 0.8rem; border-radius: 18px; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; transition: transform 220ms var(--ease-out-expo), background-color 220ms var(--ease-smooth), box-shadow 220ms var(--ease-smooth); }
    .breath-action.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .breath-action:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); }
    .breath-action:active { transform: scale(0.97); }

    .footer {
      margin-top: clamp(2.4rem, 7vh, 4rem);
      opacity: 0.2;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      line-height: 1.8;
      text-transform: uppercase;
    }
    .footer a { color: inherit; text-decoration: none; font-weight: 700; text-transform: uppercase; }
    .heart { color: var(--heart-red); }

    @media (max-width: 420px) {
      :root { --complete-bottom: 78px; }
      body { align-items: flex-start; }
      .container { min-height: 100svh; justify-content: center; padding-top: 20px; padding-bottom: 110px; }
      .editable-time { font-size: clamp(4.6rem, 28vw, 7rem); }
      .is-stacked .editable-time { font-size: clamp(5.2rem, 34vw, 8.4rem); }
      .adjusters { gap: 8px; margin-bottom: 1.8rem; }
      .adj-btn { padding: 13px 2px; font-size: 0.58rem; border-radius: 14px; }
      button.action { min-height: 56px; padding: 1.15rem 0; letter-spacing: 0.32em; }
      .break-btn { margin-top: 0.75rem; }
      .footer { margin-top: 2.2rem; }
      #reminder { padding: 14px 22px; font-size: 0.58rem; letter-spacing: 0.18em; }
      .celebration-emoji { font-size: 0.9rem; }
      .emoji-celebrate { --x: 44px; --y: -34px; }
      .emoji-trophy { --x: 0px; --y: -44px; }
      .emoji-star { --x: -42px; --y: -32px; }
      .emoji-clap { --x: -46px; --y: 18px; }
      .emoji-sparkle { --x: 46px; --y: 18px; }
      .breath-card { width: min(94vw, 340px); padding: 24px 18px 20px; border-radius: 30px; }
      .breath-orb-wrap { min-height: 190px; }
      .breath-orb { width: 116px; height: 116px; }
      .breath-ring { width: 118px; height: 118px; }
      .ring-two { width: 148px; height: 148px; }
      .ring-three { width: 176px; height: 176px; }
      .breath-actions { grid-template-columns: 1fr; }
    }

    @media (max-width: 360px) {
      :root { --complete-bottom: 86px; }
      .adjusters { gap: 14px; justify-content: center; }
      .adj-btn { background: transparent; flex: none; padding: 4px 0; min-height: 32px; font-size: 0.72rem; opacity: 0.45; }
      .adj-btn:hover { background: transparent; transform: scale(1.08); opacity: 1; }
      button.action { letter-spacing: 0.26em; }
      .footer { font-size: 0.5rem; margin-top: 1.35rem; }
    }

    @media (max-height: 650px) {
      :root { --complete-bottom: 82px; }
      .label { margin-bottom: 0.8rem; }
      #timer { margin-bottom: 1.2rem; }
      .adjusters { margin-bottom: 1.4rem; }
      .footer { margin-top: 1.2rem; }
    }

    @media (max-height: 520px) {
      :root { --complete-bottom: 96px; }
      .container { padding-top: 14px; padding-bottom: 110px; }
      .label { margin-bottom: 0.55rem; }
      #timer { margin-bottom: 0.9rem; }
      .adjusters { margin-bottom: 1rem; }
      .footer { margin-top: 0.8rem; font-size: 0.48rem; }
      .breath-card { max-height: calc(100dvh - 26px); overflow: hidden; padding-top: 18px; padding-bottom: 16px; }
      .breath-title { margin-bottom: 0.45rem; }
      .breath-orb-wrap { min-height: 132px; }
      .breath-orb { width: 88px; height: 88px; }
      .breath-ring { width: 92px; height: 92px; }
      .ring-two { width: 116px; height: 116px; }
      .ring-three { width: 138px; height: 138px; }
      .breath-count { font-size: 1.75rem; }
      .breath-guide { display: none; }
      .breath-actions { margin-top: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
      #reminder.show .celebration-emoji { opacity: 1; }
    }
  </style>
</head>
<body class="is-stacked">
  <div class="container">
    <div class="label">Timer</div>

    <div id="timer">
      <span id="m" class="editable-time" contenteditable="true">02</span>
      <span class="colon">:</span>
      <span id="s" class="editable-time" contenteditable="true">30</span>
    </div>

    <div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>

    <div class="adjusters">
      <button class="adj-btn" onclick="adjustTime(-30)">-30<sub>S</sub></button>
      <button class="adj-btn" onclick="adjustTime(-60)">-1<sub>M</sub></button>
      <button class="adj-btn" onclick="adjustTime(60)">+1<sub>M</sub></button>
      <button class="adj-btn" onclick="adjustTime(30)">+30<sub>S</sub></button>
    </div>

    <div class="controls">
      <button id="toggleBtn" class="action primary">Start</button>
      <button id="resetBtn" class="action">Reset</button>
    </div>

    <button id="breakBtn" class="break-btn" type="button">Take a breath</button>

    <footer class="footer">
      made with <span class="heart">♥</span><br />
      by <a href="https://nazirnoor.github.io/site/" target="_blank">NAZIR NOORI</a>
    </footer>
  </div>

  <div id="breathOverlay" class="breath-overlay" aria-hidden="true">
    <div class="breath-card" role="dialog" aria-modal="true" aria-label="Breathing exercise">
      <button id="closeBreathBtn" class="breath-close" type="button" aria-label="Close breathing exercise">×</button>
      <div class="breath-label">Micro break</div>
      <div class="breath-title">Breathe with the circle</div>
      <div class="breath-orb-wrap">
        <span class="breath-ring ring-one"></span>
        <span class="breath-ring ring-two"></span>
        <span class="breath-ring ring-three"></span>
        <span class="breath-particle p-one"></span>
        <span class="breath-particle p-two"></span>
        <span class="breath-particle p-three"></span>
        <span class="breath-particle p-four"></span>
        <div id="breathOrb" class="breath-orb"><span id="breathText">Inhale</span></div>
      </div>
      <div id="breathCount" class="breath-count">4</div>
      <div class="breath-guide">A short 4-2-6 reset for focus and calm.</div>
      <div class="breath-actions">
        <button id="startBreathBtn" class="breath-action primary" type="button">Start breathing</button>
        <button id="stopBreathBtn" class="breath-action" type="button">Stop</button>
      </div>
    </div>
  </div>

  <div id="reminder">
    <span class="celebration-emoji emoji-celebrate">🎉</span>
    <span class="celebration-emoji emoji-trophy">🏆</span>
    <span class="celebration-emoji emoji-star">⭐</span>
    <span class="celebration-emoji emoji-clap">👏</span>
    <span class="celebration-emoji emoji-sparkle">✨</span>
    <span class="micro-sparkle sparkle-one"></span>
    <span class="micro-sparkle sparkle-two"></span>
    <span class="micro-sparkle sparkle-three"></span>
    COMPLETE
  </div>

  <script>
    let timeLeft = 150;
    let initialDuration = 150;
    let timerId = null;
    let expectedTime = null;
    let audioCtx = null;
    let lastSecondDisplay = null;
    let breathTimer = null;
    let breathCountdown = null;
    let breathStep = 0;

    const elBody = document.body;
    const elMin = document.getElementById('m');
    const elSec = document.getElementById('s');
    const elToggle = document.getElementById('toggleBtn');
    const elReset = document.getElementById('resetBtn');
    const elReminder = document.getElementById('reminder');
    const elProgress = document.getElementById('progressBar');
    const elBreak = document.getElementById('breakBtn');
    const elBreathOverlay = document.getElementById('breathOverlay');
    const elCloseBreath = document.getElementById('closeBreathBtn');
    const elStartBreath = document.getElementById('startBreathBtn');
    const elStopBreath = document.getElementById('stopBreathBtn');
    const elBreathOrb = document.getElementById('breathOrb');
    const elBreathText = document.getElementById('breathText');
    const elBreathCount = document.getElementById('breathCount');

    const initAudio = () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    };

    const playNotification = () => {
      if (!audioCtx) return;
      const playZenTone = (freq, start, duration) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, audioCtx.currentTime + start);
        gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + start + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + start);
        osc.stop(audioCtx.currentTime + start + duration);
      };
      playZenTone(329.63, 0, 2.5);
      playZenTone(415.30, 0.2, 2.5);
      playZenTone(493.88, 0.4, 2.5);
    };

    const pulseSeconds = () => {
      elSec.classList.remove('seconds-soft-pulse');
      void elSec.offsetWidth;
      elSec.classList.add('seconds-soft-pulse');
      window.setTimeout(() => elSec.classList.remove('seconds-soft-pulse'), 380);
    };

    const updateUI = () => {
      const safeTime = Math.max(0, timeLeft);
      const m = Math.floor(safeTime / 60).toString().padStart(2, '0');
      const s = (safeTime % 60).toString().padStart(2, '0');
      const progress = initialDuration > 0 ? ((initialDuration - safeTime) / initialDuration) * 100 : 0;

      elMin.innerText = m;
      elSec.innerText = s;
      document.documentElement.style.setProperty('--progress', `${Math.min(100, Math.max(0, progress))}%`);

      if (lastSecondDisplay !== null && lastSecondDisplay !== s && timerId) pulseSeconds();
      lastSecondDisplay = s;

      document.title = (timeLeft <= 0 && !timerId) ? '!! COMPLETE !!' : `${m}:${s} | Timer`;
      timeLeft !== initialDuration ? elBody.classList.add('is-dirty') : elBody.classList.remove('is-dirty');
    };

    window.adjustTime = (seconds) => {
      syncTime();
      timeLeft = Math.max(0, timeLeft + seconds);
      if (!timerId) initialDuration = timeLeft;
      updateUI();
    };

    const syncTime = () => {
      const m = parseInt(elMin.innerText.replace(/\D/g, ''), 10) || 0;
      const s = Math.min(parseInt(elSec.innerText.replace(/\D/g, ''), 10) || 0, 59);
      timeLeft = (m * 60) + s;
    };

    const resetCelebrationAnimation = () => {
      elReminder.classList.remove('show');
      void elReminder.offsetWidth;
    };

    const tick = () => {
      if (timeLeft > 0) {
        const now = Date.now();
        const drift = now - expectedTime;
        timeLeft--;
        updateUI();
        expectedTime += 1000;
        timerId = setTimeout(tick, Math.max(0, 1000 - drift));
      } else {
        complete();
      }
    };

    const start = () => {
      initAudio();
      syncTime();
      if (timeLeft <= 0) return;
      elBody.classList.remove('finished');
      resetCelebrationAnimation();
      elBody.classList.add('is-running');
      elToggle.textContent = 'Pause';
      expectedTime = Date.now() + 1000;
      timerId = setTimeout(tick, 1000);
    };

    const pause = () => {
      elBody.classList.remove('is-running');
      clearTimeout(timerId);
      timerId = null;
      elToggle.textContent = 'Resume';
    };

    const complete = () => {
      pause();
      elBody.classList.add('finished');
      playNotification();
      elReminder.classList.add('show');
      elToggle.textContent = 'Restart';
      timeLeft = initialDuration;
      updateUI();
    };

    const reset = () => {
      pause();
      elBody.classList.remove('finished');
      resetCelebrationAnimation();
      timeLeft = initialDuration;
      elToggle.textContent = 'Start';
      updateUI();
    };

    const selectText = (element) => {
      const range = document.createRange();
      range.selectNodeContents(element);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    };

    const normalizeEditableTime = () => {
      syncTime();
      if (!timerId) initialDuration = timeLeft;
      updateUI();
    };

    [elMin, elSec].forEach((el) => {
      el.addEventListener('focus', () => selectText(el));
      el.addEventListener('keydown', (event) => {
        const allowed = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'];
        if (event.key === 'Enter') { event.preventDefault(); el.blur(); return; }
        if (allowed.includes(event.key)) return;
        if (!/^\d$/.test(event.key)) event.preventDefault();
      });
      el.addEventListener('paste', (event) => {
        event.preventDefault();
        const text = event.clipboardData.getData('text').replace(/\D/g, '').slice(0, 2);
        document.execCommand('insertText', false, text);
      });
      el.addEventListener('blur', normalizeEditableTime);
    });

    const breathPattern = [
      { label: 'Inhale', className: 'inhale', seconds: 4 },
      { label: 'Hold', className: 'hold', seconds: 2 },
      { label: 'Exhale', className: 'exhale', seconds: 6 }
    ];

    const stopBreathing = () => {
      clearTimeout(breathTimer);
      clearInterval(breathCountdown);
      breathTimer = null;
      breathCountdown = null;
      breathStep = 0;
      elBreathOrb.classList.remove('inhale', 'hold', 'exhale');
      elBreathText.textContent = 'Inhale';
      elBreathCount.textContent = '4';
    };

    const runBreathStep = () => {
      const step = breathPattern[breathStep % breathPattern.length];
      let remaining = step.seconds;
      elBreathOrb.classList.remove('inhale', 'hold', 'exhale');
      elBreathOrb.classList.add(step.className);
      elBreathText.textContent = step.label;
      elBreathCount.textContent = remaining;
      clearInterval(breathCountdown);
      breathCountdown = setInterval(() => {
        remaining -= 1;
        elBreathCount.textContent = Math.max(remaining, 0);
      }, 1000);
      clearTimeout(breathTimer);
      breathTimer = setTimeout(() => {
        clearInterval(breathCountdown);
        breathStep += 1;
        runBreathStep();
      }, step.seconds * 1000);
    };

    const openBreathing = () => {
      if (timerId) pause();
      elBreathOverlay.classList.add('show');
      elBreathOverlay.setAttribute('aria-hidden', 'false');
    };

    const closeBreathing = () => {
      stopBreathing();
      elBreathOverlay.classList.remove('show');
      elBreathOverlay.setAttribute('aria-hidden', 'true');
    };

    elBreak.addEventListener('click', openBreathing);
    elCloseBreath.addEventListener('click', closeBreathing);
    elStartBreath.addEventListener('click', () => { stopBreathing(); runBreathStep(); });
    elStopBreath.addEventListener('click', stopBreathing);
    elBreathOverlay.addEventListener('click', (event) => { if (event.target === elBreathOverlay) closeBreathing(); });

    document.addEventListener('keydown', (event) => {
      const active = document.activeElement;
      const isEditing = active && active.isContentEditable;
      if (event.key === 'Escape' && elBreathOverlay.classList.contains('show')) { closeBreathing(); return; }
      if (isEditing || elBreathOverlay.classList.contains('show')) return;
      if (event.code === 'Space') { event.preventDefault(); timerId ? pause() : start(); }
      if (event.key.toLowerCase() === 'r') reset();
      if (event.key === 'ArrowUp') { event.preventDefault(); adjustTime(60); }
      if (event.key === 'ArrowDown') { event.preventDefault(); adjustTime(-60); }
    });

    elToggle.addEventListener('click', () => timerId ? pause() : start());
    elReset.addEventListener('click', reset);
    updateUI();
  </script>
</body>
</html>
