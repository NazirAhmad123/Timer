<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100&family=Ubuntu:wght@400;500;700&display=swap');

        :root {
            --paper: #ffffff;
            --ink: #000000;
            --ink-muted: #f2f2f2;
            --heart-red: #ff4d4d;
            --action-border: #feb2b2;
            --action-text: #742a2a;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--paper);
            font-family: 'Ubuntu', sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 1s var(--ease-out-expo);
        }

        body.finished .container { transform: translateY(-10px); }

        #timer {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 2rem;
            width: 100%;
        }

        .editable-time {
            color: var(--ink);
            font-weight: 100;
            font-size: min(20vw, 7.5rem);
            outline: none;
            line-height: 0.8;
            letter-spacing: -0.02em;
        }

        .is-stacked #timer { flex-direction: column; }
        .is-stacked .editable-time { font-size: min(32vw, 9.5rem); }
        .is-stacked .colon { display: none; }

        .colon { opacity: 0.1; font-size: min(10vw, 3rem); margin: 0 10px; font-weight: 100; }

        /* --- ADJUSTERS --- */
        .adjusters {
            display: flex;
            gap: 8px;
            margin-bottom: 2.5rem;
            width: 100%;
            transition: opacity 0.8s var(--ease-out-expo);
        }
        .is-running .adjusters { opacity: 0.1; pointer-events: none; }

        .adj-btn {
            background: var(--ink-muted);
            border: none;
            padding: 14px 4px;
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--ink);
            cursor: pointer;
            flex: 1;
            border-radius: 12px;
            transition: all 0.3s var(--ease-out-expo);
        }
        .adj-btn sub { font-size: 0.4rem; bottom: 0; }

        /* --- ACTION PILL --- */
        #reminder {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translate(-50%, 200px);
            width: auto;
            background: var(--action-border);
            color: var(--action-text);
            padding: 18px 28px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: 100px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap; 
            opacity: 0;
            transition: all 0.8s var(--ease-out-expo);
            z-index: 2000;
            pointer-events: none;
        }

        #reminder.show { transform: translate(-50%, 0); opacity: 1; animation: softPulse 2.5s infinite ease-in-out; }

        @keyframes softPulse {
            0%, 100% { transform: translate(-50%, 0) scale(1); }
            50% { transform: translate(-50%, -5px) scale(1.02); }
        }

        /* --- FOOTER --- */
        .footer { 
            margin-top: 4rem; 
            opacity: 0.2; 
            font-size: 0.55rem; 
            letter-spacing: 0.2em;
            line-height: 1.8;
            text-transform: uppercase;
        }

        .footer a { color: inherit; text-decoration: none; font-weight: 700; text-transform: uppercase; }

        .heart { color: var(--heart-red); }

        /* --- SUPER SMALL SCREEN: RAW NUMBERS LAYOUT --- */
        @media (max-width: 380px) {
            .adjusters {
                gap: 20px;
                justify-content: center;
            }
            .adj-btn {
                background: transparent; /* Remove button look */
                flex: none;
                padding: 0;
                font-size: 0.8rem; /* Make numbers legible */
                opacity: 0.4;
            }
            .adj-btn:hover { background: transparent; transform: scale(1.1); opacity: 1; }
            
            #reminder { padding: 12px 20px; font-size: 0.55rem; }
        }

        .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        button.action {
            width: 100%;
            background: var(--paper);
            border: 1.2px solid var(--ink);
            padding: 1.3rem 0;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.4s var(--ease-out-expo);
        }
        button.primary { background-color: var(--ink); color: var(--paper); }
        #resetBtn { border: none; opacity: 0; pointer-events: none; font-size: 0.55rem; color: var(--ink); margin-top: 8px; }
        .is-dirty #resetBtn { opacity: 0.3; pointer-events: auto; }
    </style>
</head>
<body class="is-stacked">

<div class="container">
    <div style="font-size: 0.5rem; letter-spacing: 0.6em; text-transform: uppercase; opacity: 0.2; margin-bottom: 1.5rem;">Timer</div>
    
    <div id="timer">
        <span id="m" class="editable-time" contenteditable="true">02</span>
        <span class="colon">:</span>
        <span id="s" class="editable-time" contenteditable="true">30</span>
    </div>

    <div class="adjusters">
        <button class="adj-btn" onclick="adjustTime(-30)">-30<sub>S</sub></button>
        <button class="adj-btn" onclick="adjustTime(-60)">-1<sub>M</sub></button>
        <button class="adj-btn" onclick="adjustTime(60)">+1<sub>M</sub></button>
        <button class="adj-btn" onclick="adjustTime(30)">+30<sub>S</sub></button>
    </div>
    
    <div class="controls">
        <button id="toggleBtn" class="action primary">Start</button>
        <button id="resetBtn" class="action">Reset</button>
    </div>

    <footer class="footer">
        made with <span class="heart">♥</span><br>
        by <a href="https://nazirnoor.github.io/site/" target="_blank">NAZIR NOORI</a>
    </footer>
</div>

<div id="reminder">COMPLETE</div>

<script>
    let timeLeft = 150;
    let initialDuration = 150;
    let timerId = null;
    let expectedTime = null;
    let audioCtx = null;

    const elBody = document.body;
    const elMin = document.getElementById('m');
    const elSec = document.getElementById('s');
    const elToggle = document.getElementById('toggleBtn');
    const elReset = document.getElementById('resetBtn');
    const elReminder = document.getElementById('reminder');

    const initAudio = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

    const playNotification = () => {
        if (!audioCtx) return;
        const playZenTone = (freq, start, duration) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime + start);
            gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + start + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + duration);
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + start); osc.stop(audioCtx.currentTime + start + duration);
        };
        playZenTone(329.63, 0, 2.5);
        playZenTone(415.30, 0.2, 2.5);
        playZenTone(493.88, 0.4, 2.5);
    };

    const updateUI = () => {
        const m = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
        const s = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
        elMin.innerText = m;
        elSec.innerText = s;
        document.title = (timeLeft <= 0 && !timerId) ? "!! COMPLETE !!" : `${m}:${s} | Timer`;
        timeLeft !== initialDuration ? elBody.classList.add('is-dirty') : elBody.classList.remove('is-dirty');
    };

    window.adjustTime = (seconds) => {
        syncTime();
        timeLeft = Math.max(0, timeLeft + seconds);
        if (!timerId) initialDuration = timeLeft;
        updateUI();
    };

    const syncTime = () => {
        const m = parseInt(elMin.innerText.replace(/\D/g,'')) || 0;
        const s = parseInt(elSec.innerText.replace(/\D/g,'')) || 0;
        timeLeft = (m * 60) + s;
    };

    const tick = () => {
        if (timeLeft > 0) {
            const now = Date.now();
            const drift = now - expectedTime;
            timeLeft--;
            updateUI();
            expectedTime += 1000;
            timerId = setTimeout(tick, Math.max(0, 1000 - drift));
        } else {
            complete();
        }
    };

    const start = () => {
        initAudio();
        syncTime();
        if (timeLeft <= 0) return;
        elBody.classList.remove('finished');
        elReminder.classList.remove('show');
        elBody.classList.add('is-running');
        elToggle.textContent = "Pause";
        expectedTime = Date.now() + 1000;
        timerId = setTimeout(tick, 1000);
    };

    const pause = () => {
        elBody.classList.remove('is-running');
        clearTimeout(timerId);
        timerId = null;
        elToggle.textContent = "Resume";
    };

    const complete = () => {
        pause();
        elBody.classList.add('finished');
        playNotification();
        elReminder.classList.add('show');
        elToggle.textContent = "Restart";
        timeLeft = initialDuration;
        updateUI();
    };

    const reset = () => {
        pause();
        elBody.classList.remove('finished');
        elReminder.classList.remove('show');
        timeLeft = initialDuration;
        elToggle.textContent = "Start";
        updateUI();
    };

    elToggle.addEventListener('click', () => (timerId ? pause() : start()));
    elReset.addEventListener('click', reset);
    updateUI();
</script>

</body>
</html>
