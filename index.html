<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02:30 | Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100&family=Ubuntu:wght@400;500;700&display=swap');

        :root {
            --paper: #ffffff;
            --ink: #000000;
            --ink-muted: #e0e0e0;
            --heart-red: #ff4d4d;
            --reminder-yellow: #fff9db;
            --action-bg: #fff5f5; 
            --action-text-deep: #742a2a;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--paper);
            font-family: 'Ubuntu', sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            transition: background-color 1.5s var(--ease-out-expo), color 1s var(--ease-out-expo);
        }

        body.finished {
            background-color: var(--action-bg);
            animation: breatheRed 4s infinite alternate var(--ease-out-expo);
        }

        @keyframes breatheRed {
            from { background-color: #fff5f5; }
            to { background-color: #ffebeb; }
        }

        body.finished .adj-btn {
            background: transparent;
            color: var(--action-text-deep);
            opacity: 0.4;
            transform: scale(0.95);
        }

        /* --- COMMAND PALETTE --- */
        .info-trigger {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 32px;
            height: 32px;
            border: 1.2px solid var(--ink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
            opacity: 0.15;
            transition: all 0.4s var(--ease-out-expo);
            z-index: 1001;
        }

        /* --- CORE CONTAINER --- */
        .container {
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.8s var(--ease-out-expo);
        }

        /* Small Screen Fluid Adjustment */
        @media (max-width: 400px) {
            body {
                justify-content: flex-start; /* Shift right (to show more left content) or left */
                padding-left: 20px;
            }
            .container {
                align-items: flex-start;
                text-align: left;
            }
            #timer {
                justify-content: flex-start !important;
            }
            .editable-time {
                font-size: min(28vw, 6rem) !important;
            }
            .set-timer-hint {
                font-size: 0.45rem !important;
                margin-left: 5px;
            }
            .controls, .adjusters {
                max-width: 280px;
            }
        }

        .set-timer-hint {
            font-size: 0.55rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.2;
            margin-bottom: 1.5rem;
        }

        #timer {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 2rem;
            width: 100%;
            transition: flex-direction 0.5s var(--ease-out-expo);
        }

        .editable-time {
            color: var(--ink);
            font-weight: 100;
            font-size: min(20vw, 7rem);
            outline: none;
            line-height: 0.8;
            letter-spacing: -0.01em;
            transition: color 1s var(--ease-out-expo);
        }

        .is-stacked #timer { flex-direction: column; }
        .is-stacked .editable-time { font-size: min(35vw, 9rem); }
        .is-stacked .colon { display: none; }

        .colon { opacity: 0.15; font-size: min(10vw, 3rem); margin: 0 8px; font-weight: 100; }
        
        /* --- ADJUSTERS --- */
        .adjusters {
            display: flex;
            gap: 10px;
            margin-bottom: 2.5rem;
            width: 100%;
            transition: all 1s var(--ease-out-expo);
        }
        .is-running .adjusters { opacity: 0.15; pointer-events: none; transform: scale(0.98); }

        .adj-btn {
            background: #fafafa;
            border: none;
            padding: 15px 5px;
            font-size: 0.65rem;
            font-family: 'Ubuntu';
            font-weight: 700;
            color: var(--ink);
            cursor: pointer;
            flex: 1;
            border-radius: 14px;
            transition: all 0.6s var(--ease-out-expo);
        }
        .adj-btn:hover { background: #f0f0f0; transform: translateY(-1px); }

        .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; }

        button.action {
            width: 100%;
            background: var(--paper);
            border: 1.5px solid var(--ink);
            padding: 1.4rem 0;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 18px;
            transition: all 0.6s var(--ease-out-expo);
        }

        button.primary { background-color: var(--ink); color: var(--paper); }

        #resetBtn { border: none; opacity: 0; pointer-events: none; font-size: 0.55rem; color: var(--ink); margin-top: 5px; }
        .is-dirty #resetBtn { opacity: 0.3; pointer-events: auto; }

        #viewSwitcher {
            margin-top: 1.5rem;
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #ccc;
            background: none; border: none; cursor: pointer;
            transition: color 0.3s;
        }

        /* --- FLUID REMINDER PILL --- */
        #reminder {
            position: fixed;
            bottom: 45px;
            left: 50%;
            transform: translate(-50%, 120%) scale(0.8);
            background: #feb2b2;
            color: var(--action-text-deep);
            padding: 16px 32px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            box-shadow: 0 20px 40px rgba(116, 42, 42, 0.15);
            border-radius: 100px;
            opacity: 0;
            transition: all 1s var(--ease-out-expo);
            z-index: 2000;
            white-space: nowrap;
            pointer-events: none;
        }
        #reminder.show { 
            transform: translate(-50%, 0) scale(1); 
            opacity: 1; 
            animation: fluidPulse 3s infinite ease-in-out;
        }

        @keyframes fluidPulse {
            0%, 100% { box-shadow: 0 20px 40px rgba(116, 42, 42, 0.15); }
            50% { box-shadow: 0 10px 25px rgba(116, 42, 42, 0.25); transform: translate(-50%, -3px) scale(1.02); }
        }

        .footer { 
            margin-top: 4rem; 
            opacity: 0.15; 
            font-size: 0.5rem; 
            letter-spacing: 0.2em;
            line-height: 1.8;
            text-align: center;
        }
    </style>
</head>
<body class="is-stacked">

<div class="info-trigger">?</div>

<div class="container">
    <div class="set-timer-hint">Set Timer</div>
    
    <div id="timer">
        <span id="m" class="editable-time" contenteditable="true">02</span>
        <span class="colon">:</span>
        <span id="s" class="editable-time" contenteditable="true">30</span>
    </div>

    <div class="adjusters">
        <button class="adj-btn" onclick="adjustTime(-30)">-30s</button>
        <button class="adj-btn" onclick="adjustTime(-60)">-1M</button>
        <button class="adj-btn" onclick="adjustTime(60)">+1M</button>
        <button class="adj-btn" onclick="adjustTime(30)">+30s</button>
    </div>
    
    <div class="controls">
        <button id="toggleBtn" class="action primary">Start</button>
        <button id="resetBtn" class="action">Reset Session</button>
    </div>

    <button id="viewSwitcher">Layout</button>

    <footer class="footer">
        made with ♥<br>by Nazir Noori
    </footer>
</div>

<div id="reminder">Action Required</div>

<script>
    let timeLeft = 150;
    let initialDuration = 150;
    let timerId = null;
    let expectedTime = null;
    let audioCtx = null;

    const elBody = document.body;
    const elMin = document.getElementById('m');
    const elSec = document.getElementById('s');
    const elToggle = document.getElementById('toggleBtn');
    const elReset = document.getElementById('resetBtn');
    const elReminder = document.getElementById('reminder');
    const elView = document.getElementById('viewSwitcher');

    elView.addEventListener('click', () => elBody.classList.toggle('is-stacked'));

    const initAudio = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

    const playNotification = () => {
        if (!audioCtx) return;
        const playZenTone = (freq, start, duration) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime + start);
            gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + start + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + duration);
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + start); osc.stop(audioCtx.currentTime + start + duration);
        };
        playZenTone(329.63, 0, 2.5);
        playZenTone(415.30, 0.2, 2.5);
        playZenTone(493.88, 0.4, 2.5);
    };

    const updateUI = () => {
        const m = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
        const s = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
        elMin.innerText = m;
        elSec.innerText = s;
        document.title = (timeLeft <= 0 && !timerId) ? "!! DONE !!" : `${m}:${s} | Timer`;
        timeLeft !== initialDuration ? elBody.classList.add('is-dirty') : elBody.classList.remove('is-dirty');
    };

    window.adjustTime = (seconds) => {
        syncTime();
        timeLeft = Math.max(0, timeLeft + seconds);
        if (!timerId) initialDuration = timeLeft;
        updateUI();
    };

    const syncTime = () => {
        const m = parseInt(elMin.innerText.replace(/\D/g,'')) || 0;
        const s = parseInt(elSec.innerText.replace(/\D/g,'')) || 0;
        timeLeft = (m * 60) + s;
    };

    const tick = () => {
        if (timeLeft > 0) {
            const now = Date.now();
            const drift = now - expectedTime;
            timeLeft--;
            updateUI();
            expectedTime += 1000;
            timerId = setTimeout(tick, Math.max(0, 1000 - drift));
        } else {
            complete();
        }
    };

    const start = () => {
        initAudio();
        syncTime();
        if (timeLeft <= 0) return;
        elBody.classList.remove('finished');
        elReminder.classList.remove('show');
        elBody.classList.add('is-running');
        elToggle.textContent = "Pause";
        expectedTime = Date.now() + 1000;
        timerId = setTimeout(tick, 1000);
    };

    const pause = () => {
        elBody.classList.remove('is-running');
        clearTimeout(timerId);
        timerId = null;
        elToggle.textContent = "Resume";
    };

    const complete = () => {
        pause();
        elBody.classList.add('finished');
        playNotification();
        elReminder.classList.add('show');
        elToggle.textContent = "Restart";
        timeLeft = initialDuration;
        updateUI();
    };

    const reset = () => {
        pause();
        elBody.classList.remove('finished');
        elReminder.classList.remove('show');
        timeLeft = initialDuration;
        elToggle.textContent = "Start";
        updateUI();
    };

    elToggle.addEventListener('click', () => (timerId ? pause() : start()));
    elReset.addEventListener('click', reset);
    updateUI();
</script>

</body>
</html>
