let timeLeft=150,initialDuration=150,timerId=null,expectedTime=null,audioCtx=null,lastSecondDisplay=null,breathTimer=null,breathCountdown=null,breathStep=0;const elBody=document.body,elMin=document.getElementById('m'),elSec=document.getElementById('s'),elToggle=document.getElementById('toggleBtn'),elReset=document.getElementById('resetBtn'),elReminder=document.getElementById('reminder'),elStatus=document.getElementById('statusText'),elBreak=document.getElementById('breakBtn'),elBreathOverlay=document.getElementById('breathOverlay'),elCloseBreath=document.getElementById('closeBreathBtn'),elStartBreath=document.getElementById('startBreathBtn'),elStopBreath=document.getElementById('stopBreathBtn'),elBreathOrb=document.getElementById('breathOrb'),elBreathText=document.getElementById('breathText'),elBreathCount=document.getElementById('breathCount');const initAudio=()=>{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()};const playNotification=()=>{if(!audioCtx)return;const tone=(freq,start,dur)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.setValueAtTime(freq,audioCtx.currentTime+start);filter.type='lowpass';filter.frequency.setValueAtTime(800,audioCtx.currentTime+start);gain.gain.setValueAtTime(0,audioCtx.currentTime+start);gain.gain.linearRampToValueAtTime(.15,audioCtx.currentTime+start+.1);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+start+dur);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+start);osc.stop(audioCtx.currentTime+start+dur)};tone(329.63,0,2.5);tone(415.3,.2,2.5);tone(493.88,.4,2.5)};const haptic=(ms=10)=>{try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}};const saveDuration=()=>{try{localStorage.setItem('nazirTimerDuration',String(initialDuration))}catch(e){}};const restoreDuration=()=>{try{const saved=parseInt(localStorage.getItem('nazirTimerDuration'),1
