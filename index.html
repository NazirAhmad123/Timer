
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Timer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100&family=Ubuntu:wght@400;500;700&display=swap');

    :root {
      --paper:#fff; --ink:#000; --muted:#f2f2f2; --heart:#ff4d4d;
      --pill:#feb2b2; --pillText:#742a2a; --shadow:rgba(0,0,0,.08);
      --emojiShadow:rgba(0,0,0,.14); --bottom:68px; --progress:0%;
      --e1:cubic-bezier(.16,1,.3,1); --e2:cubic-bezier(.19,1,.22,1); --e3:cubic-bezier(.4,0,.2,1);
    }

    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { height:100%; scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh; min-height:100svh; min-height:100dvh;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
      background:var(--paper); color:var(--ink); font-family:'Ubuntu',sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
    }

    body::before, body::after {
      content:""; position:fixed; inset:-22%; pointer-events:none; opacity:0;
      transform:scale(.96); transition:opacity .9s var(--e2), transform .9s var(--e2);
    }
    body::before { z-index:-2; background:radial-gradient(circle at 50% 30%,rgba(254,178,178,.12),transparent 34%),radial-gradient(circle at 50% 72%,rgba(0,0,0,.035),transparent 32%); }
    body::after { z-index:-3; background:linear-gradient(115deg,transparent,rgba(254,178,178,.035),transparent); animation:bgDrift 16s linear infinite; }
    body.is-running::before, body.finished::before, body.is-running::after, body.finished::after { opacity:1; transform:scale(1); }
    @keyframes bgDrift { to { transform:translate3d(2%,1%,0) rotate(360deg); } }

    .container {
      width:min(92vw,450px); padding:clamp(16px,4vw,24px); text-align:center;
      display:flex; flex-direction:column; align-items:center;
      transition:transform .9s var(--e1), opacity .5s var(--e3);
      animation:pageIntro .7s var(--e2) both;
    }
    @keyframes pageIntro { from { opacity:0; transform:translate3d(0,10px,0) scale(.992); } to { opacity:1; transform:translate3d(0,0,0) scale(1); } }
    body.finished .container { transform:translateY(-10px); }
    body.is-paused .container { opacity:.86; }

    .label { font-size:.5rem; letter-spacing:.6em; text-transform:uppercase; opacity:.2; margin-bottom:clamp(1rem,3vh,1.5rem); transition:opacity .4s var(--e3), transform .5s var(--e2); }
    body.is-running .label { opacity:.12; transform:translateY(-2px); }

    #timer { position:relative; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Montserrat',sans-serif; margin-bottom:clamp(1.15rem,3.6vh,1.85rem); isolation:isolate; will-change:transform; }
    #timer::before { content:""; position:absolute; width:min(72vw,310px); height:min(72vw,310px); border-radius:50%; background:radial-gradient(circle at 50% 46%,rgba(0,0,0,.052),transparent 42%),radial-gradient(circle at 50% 50%,rgba(254,178,178,.2),transparent 58%); opacity:0; transform:scale(.82); filter:blur(18px); z-index:-1; transition:opacity .9s var(--e2), transform .9s var(--e2); }
    body.is-running #timer::before { opacity:1; transform:scale(1); animation:halo 6.8s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity:.58; transform:scale(.97); } 50% { opacity:.9; transform:scale(1.035); } }
    body.finished #timer { animation:timerLift .9s cubic-bezier(.34,1.18,.64,1); }
    @keyframes timerLift { 0% { transform:translateY(0) scale(1); } 38% { transform:translateY(-8px) scale(1.018); } 100% { transform:translateY(0) scale(1); } }

    .editable-time {
      color:var(--ink); font-weight:100; font-size:clamp(5.6rem,30vw,9.5rem);
      outline:0; line-height:.82; letter-spacing:-.04em; min-width:1.3em;
      text-shadow:0 18px 42px rgba(0,0,0,.035); transform:translate3d(0,0,0);
      transition:letter-spacing .7s var(--e2), text-shadow .7s var(--e2), transform .42s var(--e2), filter .42s var(--e2), background-color .24s var(--e3), box-shadow .24s var(--e3), color .35s var(--e3);
      will-change:transform,filter;
    }
    .editable-time:hover { filter:brightness(1.03); }
    .editable-time:focus { border-radius:18px; background:linear-gradient(180deg,rgba(0,0,0,.035),rgba(0,0,0,.015)); box-shadow:0 0 0 10px rgba(0,0,0,.025); caret-color:transparent; }
    body.is-running .editable-time { letter-spacing:-.055em; text-shadow:0 22px 48px rgba(0,0,0,.052),0 0 18px rgba(254,178,178,.14); animation:numberFloat 8s ease-in-out infinite; }
    #s { animation-delay:.12s; }
    @keyframes numberFloat { 0%,100% { transform:translate3d(0,0,0) scale(1); filter:brightness(1); } 50% { transform:translate3d(0,-1px,0) scale(1.002); filter:brightness(1.015); } }
    .seconds-soft-pulse { animation:secondsPulse .34s var(--e2); }
    @keyframes secondsPulse { 0%,100% { transform:translate3d(0,0,0) scale(1); filter:brightness(1); } 45% { transform:translate3d(0,-.7px,0) scale(1.0035); filter:brightness(1.022); text-shadow:0 22px 48px rgba(0,0,0,.055),0 0 20px rgba(254,178,178,.2); } }
    body.finished .editable-time { animation:numberDone 1.4s var(--e2); text-shadow:0 20px 45px rgba(0,0,0,.055),0 0 28px rgba(254,178,178,.28); }
    @keyframes numberDone { 0% { opacity:.88; transform:translate3d(0,0,0) scale(1); } 38% { opacity:1; transform:translate3d(0,-7px,0) scale(1.025); filter:brightness(1.08); } 100% { opacity:1; transform:translate3d(0,0,0) scale(1); } }
    .colon { display:none; }

    .progress-track { position:relative; width:100%; height:3px; border-radius:999px; overflow:hidden; background:rgba(0,0,0,.045); margin-bottom:clamp(1.15rem,3.6vh,1.9rem); opacity:0; transform:translateY(4px); transition:opacity .52s var(--e3), transform .52s var(--e2); }
    body.is-running .progress-track, body.finished .progress-track { opacity:1; transform:translateY(0); }
    .progress-bar { height:100%; width:var(--progress); border-radius:inherit; background:linear-gradient(90deg,rgba(0,0,0,.78),rgba(0,0,0,.36)); transition:width .42s linear; }
    .progress-track::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.58),transparent); transform:translateX(-110%); opacity:0; }
    body.is-running .progress-track::after { animation:progressSheen 3.8s ease-in-out infinite; opacity:.65; }
    @keyframes progressSheen { 0%,45% { transform:translateX(-110%); } 75%,100% { transform:translateX(125%); } }

    .status-text { height:1rem; margin:-.35rem 0 .85rem; font-size:.54rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; opacity:.22; transition:opacity .35s var(--e3), transform .35s var(--e2), color .35s var(--e3); }
    body.is-running .status-text { opacity:.34; transform:translateY(-1px); }
    body.is-paused .status-text { opacity:.42; }
    .shortcut-hint { font-size:.46rem; letter-spacing:.12em; text-transform:uppercase; opacity:.14; margin:-.45rem 0 .85rem; transition:opacity .35s var(--e3), transform .35s var(--e2); }
    body.is-running .shortcut-hint { opacity:0; transform:translateY(4px); pointer-events:none; }
    .mini-orbit { height:10px; width:54px; margin:-.25rem 0 .8rem; position:relative; opacity:0; transition:opacity .5s var(--e3), transform .5s var(--e2); }
    .mini-orbit span { position:absolute; top:3px; width:4px; height:4px; border-radius:50%; background:rgba(0,0,0,.18); }
    .mini-orbit span:nth-child(1){left:10px}.mini-orbit span:nth-child(2){left:25px}.mini-orbit span:nth-child(3){left:40px}
    body.is-running .mini-orbit { opacity:.6; animation:orbitFloat 3.6s ease-in-out infinite; }
    body.is-running .mini-orbit span { animation:dotPulse 1.8s ease-in-out infinite; }
    .mini-orbit span:nth-child(2){animation-delay:.2s}.mini-orbit span:nth-child(3){animation-delay:.4s}
    @keyframes orbitFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
    @keyframes dotPulse { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:.8; transform:scale(1.15); } }

    .adjusters { display:flex; gap:8px; margin-bottom:clamp(1.35rem,4vh,2.2rem); width:100%; transition:opacity .7s var(--e1), transform .7s var(--e1); }
    .is-running .adjusters { opacity:.12; pointer-events:none; transform:translateY(4px); }
    .adj-btn { background:var(--muted); border:0; padding:14px 4px; min-height:44px; font-size:.6rem; font-weight:700; color:var(--ink); cursor:pointer; flex:1; border-radius:12px; transition:transform .25s var(--e1), background-color .25s var(--e3), opacity .25s var(--e3), box-shadow .25s var(--e3), filter .25s var(--e3); }
    .adj-btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.045); filter:brightness(1.01); }
    .adj-btn:active { transform:scale(.96); }
    .adj-btn sub { font-size:.4rem; }
    .controls { width:100%; display:flex; flex-direction:column; gap:10px; }
    button { font-family:inherit; }
    button.action { width:100%; background:var(--paper); border:1.2px solid var(--ink); padding:1.3rem 0; min-height:54px; font-size:.65rem; font-weight:700; letter-spacing:.4em; text-transform:uppercase; cursor:pointer; border-radius:16px; transition:transform .25s var(--e1), background-color .25s var(--e3), color .25s var(--e3), opacity .25s var(--e3), box-shadow .25s var(--e3), letter-spacing .25s var(--e3); }
    button.action:hover { box-shadow:0 14px 30px rgba(0,0,0,.055); transform:translateY(-1px); letter-spacing:.42em; }
    button.action:active { transform:scale(.98); }
    button.primary { background:var(--ink); color:var(--paper); }
    button.action,.adj-btn,.break-btn,.breath-action { position:relative; overflow:hidden; }
    button.action::before,.adj-btn::before,.breath-action::before { content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 0%,rgba(255,255,255,.24) 36%,transparent 68%); transform:translateX(-120%); opacity:0; pointer-events:none; }
    button.action:hover::before,.adj-btn:hover::before,.breath-action:hover::before { animation:buttonSheen .85s var(--e2); opacity:1; }
    @keyframes buttonSheen { to { transform:translateX(120%); } }
    button.action:focus-visible,.adj-btn:focus-visible,.break-btn:focus-visible,.breath-action:focus-visible,.breath-close:focus-visible,.editable-time:focus-visible { outline:2px solid rgba(0,0,0,.32); outline-offset:3px; }
    #resetBtn { border:0; opacity:0; pointer-events:none; font-size:.55rem; color:var(--ink); margin-top:8px; }
    .is-dirty #resetBtn { opacity:.3; pointer-events:auto; }

    .break-btn { margin-top:1rem; border:0; background:transparent; color:var(--ink); opacity:.24; font-size:.55rem; font-weight:700; letter-spacing:.24em; text-transform:uppercase; cursor:pointer; padding:.7rem 1rem; border-radius:999px; transition:opacity .26s var(--e3), transform .26s var(--e1), background-color .26s var(--e3); }
    .break-btn:hover { opacity:.58; background:var(--muted); transform:translateY(-1px); }
    .break-btn:active { transform:scale(.97); }
    .is-running .break-btn { opacity:.14; pointer-events:none; }

    body.is-warning::before { background:radial-gradient(circle at 50% 30%,rgba(255,77,77,.08),transparent 34%),radial-gradient(circle at 50% 72%,rgba(0,0,0,.035),transparent 32%); }
    body.is-warning .editable-time { color:var(--pillText); text-shadow:0 22px 48px rgba(0,0,0,.04),0 0 20px rgba(255,77,77,.12); }
    body.is-warning .progress-bar { background:linear-gradient(90deg,rgba(116,42,42,.78),rgba(255,77,77,.45)); }
    .is-warning .status-text { color:var(--pillText); opacity:.58; }
    body.is-paused #timer { filter:saturate(.88); }
    body.is-paused .progress-bar { opacity:.55; }

    #reminder { position:fixed; bottom:var(--bottom); left:50%; transform:translate3d(-50%,92px,0) scale(.985); background:var(--pill); color:var(--pillText); padding:18px 28px; font-size:.65rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; border-radius:100px; box-shadow:0 15px 35px var(--shadow); display:flex; align-items:center; justify-content:center; white-space:nowrap; opacity:0; transition:transform .76s var(--e2), opacity .52s var(--e3), box-shadow .76s var(--e2); z-index:2000; pointer-events:none; overflow:visible; will-change:transform,opacity; }
    @supports(bottom:env(safe-area-inset-bottom)){#reminder{bottom:calc(var(--bottom) + env(safe-area-inset-bottom))}}
    #reminder.show { transform:translate3d(-50%,0,0) scale(1); opacity:1; box-shadow:0 18px 40px rgba(0,0,0,.1),0 0 0 1px rgba(255,255,255,.35) inset; animation:pillBreath 4.4s 1s ease-in-out infinite,completeGlow 2.6s 1.2s ease-in-out infinite; }
    @keyframes pillBreath { 0%,100% { transform:translate3d(-50%,0,0) scale(1); } 45% { transform:translate3d(-50%,-3px,0) scale(1.016); } 72% { transform:translate3d(-50%,-1px,0) scale(1.006); } }
    @keyframes completeGlow { 0%,100% { box-shadow:0 18px 40px rgba(0,0,0,.1),0 0 0 1px rgba(255,255,255,.35) inset; } 50% { box-shadow:0 20px 48px rgba(0,0,0,.11),0 0 0 1px rgba(255,255,255,.4) inset,0 0 34px rgba(254,178,178,.28); } }
    #reminder::after { content:""; position:absolute; inset:1px; border-radius:inherit; background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.42) 42%,transparent 68%); opacity:0; transform:translateX(-30%); pointer-events:none; }
    #reminder.show::after { animation:completeSheen 1.4s .45s var(--e2) forwards; }
    @keyframes completeSheen { 0% { opacity:0; transform:translateX(-32%); } 25% { opacity:.62; } 100% { opacity:0; transform:translateX(32%); } }
    .complete-label{display:inline-block}.complete-credit{display:none;color:var(--pillText);font-size:.43rem;font-weight:700;letter-spacing:.14em;line-height:1.45;text-transform:uppercase;opacity:0;transform:translate3d(0,4px,0);transition:opacity .52s var(--e3),transform .62s var(--e1);pointer-events:auto}.complete-credit a{color:inherit;text-decoration:none;font-weight:700}.complete-credit .heart{color:var(--heart)}

    .celebration-emoji { position:absolute; left:50%; top:50%; font-size:1.08rem; opacity:0; pointer-events:none; z-index:2; text-shadow:0 8px 14px var(--emojiShadow); transform-origin:center; transform:translate3d(-50%,-50%,0) scale(.72) rotate(0); backface-visibility:hidden; will-change:transform,opacity; transform-box:fill-box; }
    .emoji-celebrate{--x:58px;--y:-38px;--rot:10deg;--delay:0ms;font-size:1.26rem}.emoji-trophy{--x:0px;--y:-55px;--rot:-4deg;--delay:70ms;font-size:1.2rem}.emoji-star{--x:-55px;--y:-36px;--rot:-10deg;--delay:130ms;font-size:1.08rem}.emoji-clap{--x:-58px;--y:23px;--rot:-8deg;--delay:190ms;font-size:1.05rem}.emoji-sparkle{--x:58px;--y:23px;--rot:8deg;--delay:250ms;font-size:1rem}
    #reminder.show .celebration-emoji{animation:emojiIn .82s calc(var(--delay) + .26s) var(--e2) forwards}#reminder.show .emoji-celebrate{animation:emojiIn .82s calc(var(--delay) + .26s) var(--e2) forwards,celebrateAlive 4.2s calc(var(--delay) + 1.15s) ease-in-out infinite}#reminder.show .emoji-trophy{animation:emojiIn .82s calc(var(--delay) + .26s) var(--e2) forwards,trophyAlive 5.2s calc(var(--delay) + 1.15s) ease-in-out infinite}#reminder.show .emoji-star{animation:emojiIn .82s calc(var(--delay) + .26s) var(--e2) forwards,starAlive 4.8s calc(var(--delay) + 1.15s) ease-in-out infinite}#reminder.show .emoji-clap{animation:emojiIn .82s calc(var(--delay) + .26s) var(--e2) forwards,clapAlive 3.6s calc(var(--delay) + 1.15s) ease-in-out infinite}#reminder.show .emoji-sparkle{animation:emojiIn .82s calc(var(--delay) + .26s) var(--e2) forwards,sparkleAlive 5.6s calc(var(--delay) + 1.15s) ease-in-out infinite}
    @keyframes emojiIn{0%{opacity:0;transform:translate3d(calc(-50% + var(--x)*.14),calc(-50% + var(--y)*.14),0) scale(.52) rotate(calc(var(--rot)*.12))}44%{opacity:1;transform:translate3d(calc(-50% + var(--x)*.84),calc(-50% + var(--y)*.84),0) scale(1.075) rotate(calc(var(--rot)*.82))}70%{opacity:1;transform:translate3d(calc(-50% + var(--x)*.97),calc(-50% + var(--y)*.97),0) scale(.992) rotate(calc(var(--rot)*.96))}100%{opacity:1;transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y)),0) scale(1) rotate(var(--rot))}}
    @keyframes celebrateAlive{0%,100%{transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y)),0) scale(1) rotate(var(--rot))}18%{transform:translate3d(calc(-50% + var(--x) + 2px),calc(-50% + var(--y) - 3px),0) scale(1.035) rotate(16deg)}42%{transform:translate3d(calc(-50% + var(--x) - 1px),calc(-50% + var(--y) + 1px),0) scale(1.005) rotate(6deg)}68%{transform:translate3d(calc(-50% + var(--x) + 1px),calc(-50% + var(--y) - 2px),0) scale(1.012) rotate(12deg)}}
    @keyframes trophyAlive{0%,100%{transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y)),0) scale(1) rotate(var(--rot))}32%{transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y) - 4px),0) scale(1.018) rotate(-1deg)}58%{transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y) + 1px),0) scale(.998) rotate(-5deg)}}
    @keyframes starAlive{0%,100%{opacity:.86;transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y)),0) scale(1) rotate(var(--rot))}38%{opacity:1;transform:translate3d(calc(-50% + var(--x) - 2px),calc(-50% + var(--y) - 3px),0) scale(1.075) rotate(11deg)}64%{opacity:.92;transform:translate3d(calc(-50% + var(--x) + 1px),calc(-50% + var(--y)),0) scale(1.015) rotate(-4deg)}}
    @keyframes clapAlive{0%,100%{transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y)),0) scale(1) rotate(var(--rot))}22%{transform:translate3d(calc(-50% + var(--x) + 1px),calc(-50% + var(--y) - 1px),0) scale(1.045) rotate(8deg)}36%{transform:translate3d(calc(-50% + var(--x) - 1px),calc(-50% + var(--y)),0) scale(1.012) rotate(-10deg)}52%{transform:translate3d(calc(-50% + var(--x) + 1px),calc(-50% + var(--y) - 1px),0) scale(1.028) rotate(5deg)}68%{transform:translate3d(calc(-50% + var(--x)),calc(-50% + var(--y)),0) scale(1.004) rotate(-7deg)}}

    const pulseMilestone=()=>{const bar=document.querySelector('.progress-track'); if(!bar)return; bar.classList.remove('milestone-pulse'); void bar.offsetWidth; bar.classList.add('milestone-pulse');};
    const resetIdle=()=>{ elBody.classList.remove('is-idle'); clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if(!timerId&&!elBreathOverlay.classList.contains('show')) elBody.classList.add('is-idle'); },6500); };
    const resetFocusDeep=()=>{ clearTimeout(focusDeepTimer); elBody.classList.remove('is-focus-deep'); if(timerId) focusDeepTimer=setTimeout(()=>elBody.classList.add('is-focus-deep'),18000); };
    const pulseSeconds=()=>{ elSec.classList.remove('seconds-soft-pulse'); void elSec.offsetWidth; elSec.classList.add('seconds-soft-pulse'); setTimeout(()=>elSec.classList.remove('seconds-soft-pulse'),380); };
    const updateUI=()=>{ const safe=Math.max(0,timeLeft), m=Math.floor(safe/60).toString().padStart(2,'0'), s=(safe%60).toString().padStart(2,'0'), progress=initialDuration>0?((initialDuration-safe)/initialDuration)*100:0; if(lastMinuteDisplay!==null&&lastMinuteDisplay!==m){elMin.classList.remove('digit-pop');void elMin.offsetWidth;elMin.classList.add('digit-pop'); pulseMilestone()} elMin.innerText=m; elSec.innerText=s; document.documentElement.style.setProperty('--progress',`${Math.min(100,Math.max(0,progress))}%`); if(lastSecondDisplay!==null&&lastSecondDisplay!==s&&timerId) pulseSeconds(); lastSecondDisplay=s; lastMinuteDisplay=m; elToggle.setAttribute('aria-pressed', timerId?'true':'false'); const isFinal=timerId&&safe<=10&&safe>0, isLastMinute=timerId&&safe<=60&&safe>10, isHalfway=initialDuration>0&&safe<=initialDuration/2; elBody.classList.toggle('is-warning',!!isFinal); elBody.classList.toggle('is-last-minute',!!isLastMinute); elBody.classList.toggle('is-halfway',!!isHalfway); elBody.classList.toggle('is-quarter',initialDuration>0&&safe<=initialDuration*.75&&safe>initialDuration*.5); elBody.classList.toggle('is-three-quarter',initialDuration>0&&safe<=initialDuration*.25&&safe>60); if(timerId) setStatus(isFinal?'Final stretch':safe<=30&&timerId?'Last 30 seconds':isLastMinute?'Under 1 minute':`Focus · ${Math.ceil(safe/60)}m left`,'focus'); else if(elBody.classList.contains('finished')) setStatus('Complete','celebrate'); else if(timeLeft!==initialDuration) setStatus('Adjusted','ready'); else setStatus('Ready when you are','ready'); document.title=(timeLeft<=0&&!timerId)?'!! COMPLETE !!':(!timerId&&elBody.classList.contains('is-paused')?`${m}:${s} paused | Timer`:`${m}:${s} | Timer`); timeLeft!==initialDuration?elBody.classList.add('is-dirty'):elBody.classList.remove('is-dirty'); resetIdle(); };
    window.adjustTime=sec=>{ if(elIterationBadge)elIterationBadge.classList.remove('show','is-hiding'); elBody.classList.remove('is-toast-visible'); syncTime(); timeLeft=Math.max(0,timeLeft+sec); if(!timerId){ initialDuration=timeLeft; saveDuration(); } updateUI(); };
    const syncTime=()=>{ const m=parseInt(elMin.innerText.replace(/\D/g,''),10)||0, s=Math.min(parseInt(elSec.innerText.replace(/\D/g,''),10)||0,59); timeLeft=m*60+s; };
    const resetCelebrationAnimation=()=>{ elReminder.classList.remove('show'); void elReminder.offsetWidth; };
    const tick=()=>{ if(timeLeft>0){ const now=Date.now(), elapsed=Math.max(1,Math.floor((now-(expectedTime-1000))/1000)); const drift=now-expectedTime; timeLeft=Math.max(0,timeLeft-elapsed); updateUI(); expectedTime+=elapsed*1000; timerId=setTimeout(tick,Math.max(0,1000-drift)); } else complete(); };
    const start=()=>{ haptic(8); initAudio(); syncTime(); if(timeLeft<=0) return; elBody.classList.remove('finished','is-paused','is-complete-settle'); resetCelebrationAnimation(); if(elIterationBadge)elIterationBadge.classList.remove('show'); elBody.classList.add('is-running'); resetFocusDeep(); elToggle.textContent='Pause';elToggle.setAttribute('aria-label','Pause timer'); expectedTime=Date.now()+1000; timerId=setTimeout(tick,1000); };
    const pause=()=>{ elBody.classList.remove('is-running','is-warning','is-last-minute','is-halfway','is-focus-deep'); clearTimeout(focusDeepTimer); elBody.classList.add('is-paused'); clearTimeout(timerId); timerId=null; elToggle.textContent='Resume';elToggle.setAttribute('aria-label','Resume timer'); setStatus('Paused'); };
    const complete=()=>{ pause(); haptic([20,30,20]); elBody.classList.remove('is-paused','is-warning'); elBody.classList.add('finished','is-complete-settle'); iterationCount++; saveIterations(); playNotification(); elReminder.classList.add('show'); showIterationBadge(); elToggle.textContent='Restart';elToggle.setAttribute('aria-label','Restart timer'); timeLeft=initialDuration; updateUI(); };
    const reset=()=>{ haptic(8); resetIdle(); pause(); elBody.classList.remove('finished','is-warning','is-last-minute','is-halfway','is-paused','is-complete-settle'); resetCelebrationAnimation(); if(elIterationBadge)elIterationBadge.classList.remove('show'); timeLeft=initialDuration; elToggle.textContent='Start';elToggle.setAttribute('aria-label','Start timer'); setStatus('Ready when you are','ready'); updateUI(); };
    const selectText=el=>{ const r=document.createRange(); r.selectNodeContents(el); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); };
    const normalize=()=>{ syncTime(); if(!timerId){ initialDuration=timeLeft; saveDuration(); } updateUI(); };
    [elMin,elSec].forEach(el=>{ el.addEventListener('focus',()=>{elBody.classList.add('is-editing');selectText(el)}); el.addEventListener('keydown',e=>{ const allowed=['Backspace','Delete','ArrowLeft','ArrowRight','Tab']; if(e.key==='Enter'){ e.preventDefault(); el.blur(); return; } if(allowed.includes(e.key)) return; if(!/^\d$/.test(e.key)) e.preventDefault(); }); el.addEventListener('paste',e=>{ e.preventDefault(); const text=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,2); document.execCommand('insertText',false,text); }); el.addEventListener('blur',()=>{elBody.classList.remove('is-editing');normalize()}); });

    const breathPattern=[{label:'Inhale',className:'inhale',seconds:4},{label:'Hold',className:'hold',seconds:2},{label:'Exhale',className:'exhale',seconds:6}];
    const stopBreathing=()=>{ elBody.classList.remove('is-breathing-active','breath-phase-inhale','breath-phase-hold','breath-phase-exhale'); clearTimeout(breathTimer); clearInterval(breathCountdown); iterationCount=0, breathTimer=null; breathCountdown=null; breathStep=0; elBreathOrb.classList.remove('inhale','hold','exhale'); elBreathText.textContent='Inhale'; elBreathCount.textContent='4'; elStartBreath.textContent='Start breathing'; };
    const runBreathStep=()=>{ const step=breathPattern[breathStep%breathPattern.length]; let remaining=step.seconds; elBreathOrb.classList.remove('inhale','hold','exhale'); elBreathOrb.classList.add(step.className); elBody.classList.add('is-breathing-active'); elBody.classList.remove('breath-phase-inhale','breath-phase-hold','breath-phase-exhale'); elBody.classList.add('breath-phase-'+step.className); elBreathText.textContent=step.label; elBreathCount.textContent=remaining; clearInterval(breathCountdown); breathCountdown=setInterval(()=>{ remaining-=1; elBreathCount.textContent=Math.max(remaining,0); elBreathCount.classList.remove('count-pop'); void elBreathCount.offsetWidth; elBreathCount.classList.add('count-pop'); },1000); clearTimeout(breathTimer); breathTimer=setTimeout(()=>{ clearInterval(breathCountdown); breathStep++; runBreathStep(); },step.seconds*1000); };
    const openBreathing=()=>{ haptic(6); document.documentElement.style.setProperty('--vh',(window.innerHeight*.01)+'px'); if(elIterationBadge)elIterationBadge.classList.remove('show','is-hiding'); elBody.classList.remove('is-toast-visible'); if(timerId) pause(); elBreathOverlay.classList.add('show'); elBody.classList.add('breath-open'); elBreathOverlay.setAttribute('aria-hidden','false'); elBreak.setAttribute('aria-expanded','true'); setTimeout(()=>elCloseBreath.focus({preventScroll:true}),80); };
    const closeBreathing=()=>{ haptic(6); stopBreathing(); elBreathOverlay.classList.remove('show'); elBody.classList.remove('breath-open'); elBreathOverlay.setAttribute('aria-hidden','true'); elBreak.setAttribute('aria-expanded','false'); };
    elBreak.addEventListener('click',openBreathing); elCloseBreath.addEventListener('click',closeBreathing); elStartBreath.addEventListener('click',()=>{ haptic(8); stopBreathing(); elStartBreath.textContent='Restart breathing'; runBreathStep(); }); elStopBreath.addEventListener('click',()=>{ haptic(6); stopBreathing(); }); elBreathOverlay.addEventListener('click',e=>{ if(e.target===elBreathOverlay) closeBreathing(); });
    document.addEventListener('keydown',e=>{ const active=document.activeElement, isEditing=active&&active.isContentEditable; if(e.key==='Escape'&&elBreathOverlay.classList.contains('show')){ closeBreathing(); return; } if(isEditing||elBreathOverlay.classList.contains('show')) return; if(e.code==='Space'){ e.preventDefault(); timerId?pause():start(); } if(e.key.toLowerCase()==='r') reset(); if(e.key.toLowerCase()==='b') openBreathing(); if(e.key==='+'||e.key==='='){e.preventDefault();adjustTime(30)} if(e.key==='-'||e.key==='_'){e.preventDefault();adjustTime(-30)} if(e.key==='ArrowUp'){ e.preventDefault(); adjustTime(60); } if(e.key==='ArrowDown'){ e.preventDefault(); adjustTime(-60); } });
    
    const handlePointerMove=e=>{ if(pointerRAF||window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; pointerRAF=requestAnimationFrame(()=>{ const x=(e.clientX/window.innerWidth)*100, y=(e.clientY/window.innerHeight)*100; document.documentElement.style.setProperty('--mx',x.toFixed(1)+'%'); document.documentElement.style.setProperty('--my',y.toFixed(1)+'%'); const tiltY=((x-50)/90).toFixed(2)+'deg', tiltX=((50-y)/120).toFixed(2)+'deg'; document.documentElement.style.setProperty('--tilt-y',tiltY); document.documentElement.style.setProperty('--tilt-x',tiltX); pointerRAF=null; }); };
    window.addEventListener('pointermove',handlePointerMove,{passive:true});
    window.addEventListener('resize',()=>document.documentElement.style.setProperty('--vh',(window.innerHeight*.01)+'px'),{passive:true}); document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timerId)updateUI()}); 
    document.querySelectorAll('.adj-btn').forEach(btn=>btn.addEventListener('click',()=>{btn.classList.remove('adjust-flash');void btn.offsetWidth;btn.classList.add('adjust-flash');resetIdle();}));
    ['pointerdown','keydown','mousemove'].forEach(evt=>window.addEventListener(evt,()=>{resetIdle();resetFocusDeep();},{passive:true}));
    elToggle.addEventListener('click',()=>timerId?pause():start()); elReset.addEventListener('click',reset); restoreDuration(); restoreIterations(); updateUI(); resetIdle();
  </script>
</body>
