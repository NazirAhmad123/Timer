imation-delay:1.4s!important}.p-four{animation-delay:2s!important}@keyframes breathParticleFloat{0%,100%{opacity:.22}50%{opacity:.64;transform:translate(var(--tx,0),var(--ty,0)) scale(1.25)}}.p-one{--tx:-80px;--ty:-62px}.p-two{--tx:80px;--ty:-52px}.p-three{--tx:-70px;--ty:76px}.p-four{--tx:66px;--ty:80px}.breath-orb{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.96),rgba(255,230,230,.72) 34%,rgba(254,178,178,.78) 72%);box-shadow:0 22px 58px rgba(254,178,178,.42),0 0 0 1px rgba(116,42,42,.08) inset;transform:scale(.82);transition:transform 3800ms cubic-bezier(.37,0,.63,1),box-shadow 3800ms ease,background 3800ms ease;will-change:transform;z-index:2}.breath-orb span{font-size:.72rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--pillText);opacity:.78}.breath-orb.inhale{transform:scale(1.24);box-shadow:0 28px 76px rgba(254,178,178,.48),0 0 0 18px rgba(254,178,178,.105),0 0 0 1px rgba(116,42,42,.08) inset}.breath-orb.hold{transform:scale(1.24);box-shadow:0 26px 68px rgba(254,178,178,.44),0 0 0 12px rgba(254,178,178,.075),0 0 0 1px rgba(116,42,42,.08) inset}.breath-orb.exhale{transform:scale(.82);box-shadow:0 16px 42px rgba(254,178,178,.30),0 0 0 0 rgba(254,178,178,0),0 0 0 1px rgba(116,42,42,.08) inset}.breath-count{font-family:Montserrat,sans-serif;font-size:2.65rem;font-weight:100;line-height:1;margin-top:.1rem;opacity:.58}.breath-guide{margin-top:.75rem;font-size:.72rem;opacity:.46}.breath-actions{display:grid;grid-template-columns:1fr .72fr;gap:10px;margin-top:1.45rem}.breath-action{border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.45);color:var(--ink);padding:.95rem .8rem;border-radius:18px;font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:transform .22s var(--expo),background-color .22s var(--smooth),opacity .22s var(--smooth),box-shadow .22s var(--smooth)}.breath-action.primary{bac /* =========================================================
   MOBILE / CHROME SPLIT-SCREEN OPTIMIZATION
   Focus: very narrow left/right split tabs and short heights
   ========================================================= */
@media (max-width: 390px) {
  body {
    align-items: flex-start;
    min-height: 100dvh;
  }

  .container {
    width: min(94vw, 360px);
    min-height: 100dvh;
    justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(112px, env(safe-area-inset-bottom));
  }

  .label {
    font-size: 0.46rem;
    letter-spacing: 0.48em;
    margin-bottom: 0.75rem;
  }

  #timer {
    margin-bottom: 1.15rem;
  }

  .editable-time {
    font-size: clamp(4.6rem, 35vw, 7.6rem);
    line-height: 0.8;
    min-width: 1.15em;
  }

  .adjusters {
    gap: 7px;
    margin-bottom: 1.25rem;
  }

  .adj-btn {
    min-height: 42px;
    padding: 11px 2px;
    font-size: 0.55rem;
    border-radius: 13px;
  }

  button.action {
    min-height: 52px;
    padding: 1.05rem 0;
    font-size: 0.6rem;
    letter-spacing: 0.28em;
    border-radius: 15px;
  }

  .break-btn {
    margin-top: 0.55rem;
    padding: 0.55rem 0.8rem;
    font-size: 0.48rem;
    letter-spacing: 0.18em;
  }

  .footer {
    margin-top: 1.45rem;
    font-size: 0.48rem;
    letter-spacing: 0.16em;
    line-height: 1.65;
  }

  #reminder {
    bottom: calc(92px + env(safe-area-inset-bottom));
    padding: 13px 20px;
    font-size: 0.55rem;
    letter-spacing: 0.16em;
  }

  .celebration-emoji {
    font-size: 0.86rem;
  }

  .emoji-celebrate { --x: 42px; --y: -32px; }
  .emoji-trophy { --x: 0px; --y: -43px; }
  .emoji-star { --x: -40px; --y: -31px; }
  .emoji-clap { --x: -43px; --y: 17px; }
  .emoji-sparkle { --x: 43px; --y: 17px; }

  .breath-overlay {
    padding: 14px;
  }

  .breath-card {
    width: min(94vw, 330px);
    padding: 22px 16px 18px;
    border-radius: 28px;
  }

  .breath-title {
    font-size: 0.9rem;
    margin-bottom: 0.8rem;
  }

  .breath-label {
    font-size: 0.48rem;
    letter-spacing: 0.28em;
    margin-bottom: 0.55rem;
  }

  .breath-orb-wrap {
    min-height: 170px;
  }

  .breath-orb {
    width: 108px;
    height: 108px;

<body class="is-stacked"><div class="container"><div class="label">Timer</div><div id="timer"><span id="m" class="editable-time" contenteditable="true">02</span><span class="colon">:</span><span id="s" class="editable-time" contenteditable="true">30</span></div><div class="adjusters"><button class="adj-btn" onclick="adjustTime(-30)">-30<sub>S</sub></button><button class="adj-btn" onclick="adjustTime(-60)">-1<sub>M</sub></button><button class="adj-btn" onclick="adjustTime(60)">+1<sub>M</sub></button><button class="adj-btn" onclick="adjustTime(30)">+30<sub>S</sub></button></div><div class="controls"><button id="toggleBtn" class="action primary">Start</button><button id="resetBtn" class="action">Reset</button></div><button id="breakBtn" class="break-btn" type="button">Take a breath</button><footer class="footer">made with <span class="heart">♥</span><br>by <a href="https://nazirnoor.github.io/site/" target="_blank">NAZIR NOORI</a></footer></div><div id="breathOverlay" class="breath-overlay" aria-hidden="true"><div class="breath-card" role="dialog" aria-modal="true" aria-label="Breathing exercise"><button id="closeBreathBtn" class="breath-close" type="button" aria-label="Close breathing exercise">×</button><div class="breath-label">Micro break</div><div class="breath-title">Breathe with the circle</div><div class="breath-orb-wrap"><span class="breath-ring ring-one"></span><span class="breath-ring ring-two"></span><span class="breath-ring ring-three"></span><span class="breath-particle p-one"></span><span class="breath-particle p-two"></span><span class="breath-particle p-three"></span><span class="breath-particle p-four"></span><div id="breathOrb" class="breath-orb"><span id="breathText">Inhale</span></div></div><div id="breathCount" class="breath-count">4</div><div class="breath-guide">A short 4-2-6 reset for focus and calm.</div><div class="breath-actions"><button id="startBreathBtn" class="breath-action primary" type="button">Start breathing</button><button id="stopBreathBtn" class="breath-action" type="button">Stop</button></div></div></div><div id="reminder"><span class="celebration-emoji emoji-celebrate">🎉</span><span class="celebration-emoji emoji-trophy">🏆</span><span class="celebration-emoji emoji-star">⭐</span><span class="celebration-emoji emoji-clap">👏</span><span class="celebration-emoji emoji-sparkle">✨</span>COMPLETE</div><script>
let timeLeft=150,initialDuration=150,timerId=null,expectedTime=null,audioCtx=null,lastSecondDisplay=null,breathTimer=null,breathCountdown=null,breathStep=0;const elBody=document.body,elMin=document.getElementById('m'),elSec=document.getElementById('s'),elToggle=document.getElementById('toggleBtn'),elReset=document.getElementById('resetBtn'),elReminder=document.getElementById('reminder'),elBreak=document.getElementById('breakBtn'),elBreathOverlay=document.getElementById('breathOverlay'),elCloseBreath=document.getElementById('closeBreathBtn'),elStartBreath=document.getElementById('startBreathBtn'),elStopBreath=document.getElementById('stopBreathBtn'),elBreathOrb=document.getElementById('breathOrb'),elBreathText=document.getElementById('breathText'),elBreathCount=document.getElementById('breathCount');const initAudio=()=>{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()};const playNotification=()=>{if(!audioCtx)return;const tone=(freq,start,duration)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.setValueAtTime(freq,audioCtx.currentTime+start);filter.type='lowpass';filter.frequency.setValueAtTime(800,audioCtx.currentTime+start);gain.gain.setValueAtTime(0,audioCtx.currentTime+start);gain.gain.linearRampToValueAtTime(.15,audioCtx.currentTime+start+.1);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+start+duration);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+start);osc.stop(audioCtx.currentTime+start+duration)};tone(329.63,0,2.5);tone(415.3,.2,2.5);tone(493.88,.4,2.5)};const pulseSeconds=()=>{elSec.classList.remove('seconds-soft-pulse');void elSec.offsetWidth;elSec.classList.add('seconds-soft-pulse');setTimeout(()=>elSec.classList.remove('seconds-soft-pulse'),380)};const updateUI=()=>{const safe=Math.max(0,timeLeft),m=Math.floor(safe/60).toString().padStart(2,'0'),s=(safe%60).toString().padStart(2,'0');elMin.innerText=m;elSec.innerText=s;if(lastSecondDisplay!==null&&lastSecondDisplay!==s&&timerId)pulseSeconds();lastSecondDisplay=s;document.title=(timeLeft<=0&&!timerId)?'!! COMPLETE !!':`${m}:${s} | Timer`;timeLeft!==initialDuration?elBody.classList.add('is-dirty'):elBody.classList.remove('is-dirty')};window.adjustTime=sec=>{syncTime();timeLeft=Math.max(0,timeLeft+sec);if(!timerId)initialDuration=timeLeft;updateUI()};const syncTime=()=>{const m=parseInt(elMin.innerText.replace(/\D/g,''),10)||0,s=Math.min(parseInt(elSec.innerText.replace(/\D/g,''),10)||0,59);timeLeft=m*60+s};const resetCelebrationAnimation=()=>{elReminder.classList.remove('show');void elReminder.offsetWidth};const tick=()=>{if(timeLeft>0){const now=Date.now(),drift=now-expectedTime;timeLeft--;updateUI();expectedTime+=1000;timerId=setTimeout(tick,Math.max(0,1000-drift))}else complete()};const start=()=>{initAudio();syncTime();if(timeLeft<=0)return;elBody.classList.remove('finished');resetCelebrationAnimation();elBody.classList.add('is-running');elToggle.textContent='Pause';expectedTime=Date.now()+1000;timerId=setTimeout(tick,1000)};const pause=()=>{elBody.classList.remove('is-running');clearTimeout(timerId);timerId=null;elToggle.textContent='Resume'};const complete=()=>{pause();elBody.classList.add('finished');playNotification();elReminder.classList.add('show');elToggle.textContent='Restart';timeLeft=initialDuration;updateUI()};const reset=()=>{pause();elBody.classList.remove('finished');resetCelebrationAnimation();timeLeft=initialDuration;elToggle.textContent='Start';updateUI()};const selectText=el=>{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r)};const normalizeEditableTime=()=>{syncTime();if(!timerId)initialDuration=timeLeft;updateUI()};const setDuration=sec=>{if(timerId)return;timeLeft=Math.max(0,sec);initialDuration=timeLeft;elBody.classList.remove('finished');resetCelebrationAnimation();elToggle.textContent='Start';updateUI()};const breathPattern=[{label:'Inhale',className:'inhale',seconds:4},{label:'Hold',className:'hold',seconds:2},{label:'Exhale',className:'exhale',seconds:6}];const stopBreathing=()=>{clearTimeout(breathTimer);clearInterval(breathCountdown);breathTimer=null;breathCountdown=null;breathStep=0;elBreathOrb.classList.remove('inhale','hold','exhale');elBreathText.textContent='Inhale';elBreathCount.textContent='4'};const runBreathStep=()=>{const step=breathPattern[breathStep%breathPattern.length];let remaining=step.seconds;elBreathOrb.classList.remove('inhale','hold','exhale');elBreathOrb.classList.add(step.className);elBreathText.textContent=step.label;elBreathCount.textContent=remaining;clearInterval(breathCountdown);breathCountdown=setInterval(()=>{remaining-=1;elBreathCount.textContent=Math.max(remaining,0)},1000);clearTimeout(breathTimer);breathTimer=setTimeout(()=>{clearInterval(breathCountdown);breathStep++;runBreathStep()},step.seconds*1000)};const openBreathing=()=>{if(timerId)pause();elBreathOverlay.classList.add('show');elBreathOverlay.setAttribute('aria-hidden','false')};const closeBreathing=()=>{stopBreathing();elBreathOverlay.classList.remove('show');elBreathOverlay.setAttribute('aria-hidden','true')};[elMin,elSec].forEach(el=>{el.addEventListener('focus',()=>selectText(el));el.addEventListener('keydown',e=>{const allowed=['Backspace','Delete','ArrowLeft','ArrowRight','Tab'];if(e.key==='Enter'){e.preventDefault();el.blur();return}if(allowed.includes(e.key))return;if(!/^\d$/.test(e.key))e.preventDefault()});el.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,2);document.execCommand('insertText',false,text)});el.addEventListener('blur',normalizeEditableTime)});document.addEventListener('keydown',e=>{const active=document.activeElement,isEditing=active&&active.isContentEditable;if(e.key==='Escape'&&elBreathOverlay.classList.contains('show')){closeBreathing();return}if(isEditing||elBreathOverlay.classList.contains('show'))return;if(e.code==='Space'){e.preventDefault();timerId?pause():start()}if(e.key.toLowerCase()==='r')reset();if(e.key==='ArrowUp'){e.preventDefault();adjustTime(60)}if(e.key==='ArrowDown'){e.preventDefault();adjustTime(-60)}});elBreak.addEventListener('click',openBreathing);elCloseBreath.addEventListener('click',closeBreathing);elStartBreath.addEventListener('click',()=>{stopBreathing();runBreathStep()});elStopBreath.addEventListener('click',stopBreathing);elBreathOverlay.addEventListener('click',e=>{if(e.target===elBreathOverlay)closeBreathing()});elToggle.addEventListener('click',()=>timerId?pause():start());elReset.addEventListener('click',reset);updateUI();
</script></body></html>
